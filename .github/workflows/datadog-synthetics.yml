name: Run Datadog Synthetic tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: datadog-synthetics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9.15.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: pnpm validate

      - name: Check Datadog credentials
        id: datadog-credentials
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DD_API_KEY}" && -n "${DD_APP_KEY}" ]]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
            echo "Datadog credentials are configured."
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "Datadog credentials are not configured; skipping Synthetic tests."
          fi

      - name: Install Datadog CI CLI
        if: steps.datadog-credentials.outputs.configured == 'true'
        run: pnpm dlx @datadog/datadog-ci@latest --version

      - name: Run Datadog Synthetic tests
        if: steps.datadog-credentials.outputs.configured == 'true'
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: pnpm dlx @datadog/datadog-ci@latest synthetics run-tests --search 'tag:e2e-tests'
