name: Datadog Synthetics

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: datadog-synthetics-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9.15.0"

jobs:
  synthetics:
    name: Run Datadog Synthetic tests
    if: >-
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download trusted source artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: irp-source-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/source-artifact
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Extract trusted source artifact
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}/source-artifact/irp-source.tar.gz" -C "${GITHUB_WORKSPACE}"

      - name: Checkout repository
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: pnpm validate

      - name: Check Datadog credentials
        id: credentials
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${DD_API_KEY}" && -n "${DD_APP_KEY}" ]]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "Datadog credentials are not configured; Synthetic tests will be skipped."
          fi

      - name: Run Datadog Synthetic tests
        if: steps.credentials.outputs.configured == 'true'
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: pnpm dlx @datadog/datadog-ci@latest synthetics run-tests --search 'tag:e2e-tests'
