name: iOS Full Client

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'clients/ios/**'
      - 'docs/phases/phase-65.md'
      - '.github/workflows/ios-client.yml'
  push:
    branches: [main]
    paths:
      - 'clients/ios/**'
      - 'docs/phases/phase-65.md'
      - '.github/workflows/ios-client.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ios-client:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Swift package test
        run: swift test --package-path clients/ios

      - name: Swift package build
        run: swift build --package-path clients/ios
