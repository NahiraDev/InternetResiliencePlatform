name: iOS Full Client

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'clients/ios/**'
      - '.github/workflows/ios-client.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'clients/ios/**'
      - '.github/workflows/ios-client.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'
  XCODE_PROJECT: clients/ios/IRP.xcodeproj
  SWIFT_PACKAGE: clients/ios
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  ios-client:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Select and verify Xcode
        run: |
          if ! test -d "$DEVELOPER_DIR"; then
            echo "Required Xcode toolchain not found: $DEVELOPER_DIR" >&2
            echo 'Installed Xcode bundles:' >&2
            find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print
            exit 1
          fi
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          XCODEBUILD_PATH="$(DEVELOPER_DIR="$DEVELOPER_DIR" xcrun --find xcodebuild)"
          SWIFT_PATH="$(DEVELOPER_DIR="$DEVELOPER_DIR" xcrun --find swift)"
          test -n "$XCODEBUILD_PATH"
          test -x "$XCODEBUILD_PATH"
          test -n "$SWIFT_PATH"
          test -x "$SWIFT_PATH"
          echo "xcodebuild=$XCODEBUILD_PATH"
          echo "swift=$SWIFT_PATH"
          DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -version
          DEVELOPER_DIR="$DEVELOPER_DIR" swift --version

      - name: Verify workspace install
        run: pnpm install --frozen-lockfile

      - name: Verify Swift package
        working-directory: clients/ios
        run: |
          swift package resolve
          swift test
          swift build

      - name: Verify Xcode project
        run: |
          test -f "$XCODE_PROJECT/project.pbxproj"
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Validate Xcode project metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('clients/ios/IRP.xcodeproj/project.pbxproj').read_text()
          required = [
              'name = IRP;',
              'name = IRPPacketTunnel;',
              'com.apple.product-type.application',
              'com.apple.product-type.app-extension',
              'R10000010000000000000003 /* Embed Foundation Extensions */',
              'A10000010000000000000009 /* PacketTunnelProvider.swift in Sources */',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing Xcode project contract entries: {missing}')
          if 'files = (A10000010000000000000009, A10000010000000000000006);' in text:
              raise SystemExit('PacketTunnelConfiguration.swift must not be compiled by IRPPacketTunnel')
          print('Xcode project metadata contract passed')
          PY

      - name: Validate iOS client source inventory
        run: |
          test -f clients/ios/App/IRPiOSApp.swift
          test -f clients/ios/App/Info.plist
          test -f clients/ios/App/IRP.entitlements
          test -f clients/ios/PacketTunnel/PacketTunnelProvider.swift
          test -f clients/ios/PacketTunnel/Info.plist
          test -f clients/ios/PacketTunnel/PacketTunnel.entitlements
          test -f clients/ios/Sources/IRPiOSClient/PacketTunnelConfiguration.swift
          echo 'iOS client source inventory passed'

      - name: Diagnose Xcode build configuration
        run: |
          set +e
          LOG_FILE="${RUNNER_TEMP}/xcodebuild-show-build-settings.log"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme IRP \
            -sdk iphonesimulator \
            -configuration Debug \
            -showBuildSettings >"$LOG_FILE" 2>&1
          STATUS=$?
          cat "$LOG_FILE"
          if [ "$STATUS" -ne 0 ]; then
            echo "Xcode build-settings diagnostic failed with exit code $STATUS; the mandatory build step will still execute." >&2
          else
            echo 'Xcode build-settings diagnostic passed'
          fi
          exit 0

      - name: Build iOS app and packet tunnel
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme IRP \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
