name: iOS Full Client

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'clients/ios/**'
      - '.github/workflows/ios-client.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'clients/ios/**'
      - '.github/workflows/ios-client.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: ios-client-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'
  XCODE_PROJECT: clients/ios/IRP.xcodeproj
  SWIFT_PACKAGE: clients/ios

jobs:
  ios-client:
    # Keep the macOS 14 lane for reproducibility, but discover the Xcode bundle
    # installed on the runner instead of hard-coding a toolchain path.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Select and verify Xcode
        run: |
          set -euo pipefail

          echo 'Installed Xcode bundles:'
          find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V

          candidates=()
          while IFS= read -r bundle; do
            candidates+=("$bundle")
          done < <(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort -V -r)

          if (( ${#candidates[@]} == 0 )); then
            echo 'No Xcode bundle found under /Applications.' >&2
            exit 1
          fi

          selected=''
          for bundle in "${candidates[@]}"; do
            version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Contents/Info.plist" 2>/dev/null || true)"
            if [[ "$version" =~ ^16\. ]]; then
              selected="$bundle"
              break
            fi
          done

          if [[ -z "$selected" ]]; then
            selected="${candidates[0]}"
          fi

          export DEVELOPER_DIR="$selected/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "Selected Xcode bundle: $selected"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"

          XCODEBUILD_PATH="$(xcrun --find xcodebuild)"
          SWIFT_PATH="$(xcrun --find swift)"
          test -n "$XCODEBUILD_PATH"
          test -x "$XCODEBUILD_PATH"
          test -n "$SWIFT_PATH"
          test -x "$SWIFT_PATH"
          echo "xcodebuild=$XCODEBUILD_PATH"
          echo "swift=$SWIFT_PATH"
          xcodebuild -version
          swift --version

      - name: Verify workspace install
        run: pnpm install --frozen-lockfile

      - name: Verify Swift package
        working-directory: clients/ios
        run: |
          swift package resolve
          swift test
          swift build

      - name: Verify Xcode project
        run: |
          test -f "$XCODE_PROJECT/project.pbxproj"
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Validate Xcode project metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('clients/ios/IRP.xcodeproj/project.pbxproj').read_text()
          required = [
              'name = IRP;',
              'name = IRPPacketTunnel;',
              'com.apple.product-type.application',
              'com.apple.product-type.app-extension',
              'R10000010000000000000003 /* Embed Foundation Extensions */',
              'A10000010000000000000009 /* PacketTunnelProvider.swift in Sources */',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing Xcode project contract entries: {missing}')
          if 'files = (A10000010000000000000009, A10000010000000000000006);' in text:
              raise SystemExit('PacketTunnelConfiguration.swift must not be compiled by IRPPacketTunnel')
          print('Xcode project metadata contract passed')
          PY

      - name: Validate iOS client source inventory
        run: |
          test -f clients/ios/App/IRPiOSApp.swift
          test -f clients/ios/App/Info.plist
          test -f clients/ios/App/IRP.entitlements
          test -f clients/ios/PacketTunnel/PacketTunnelProvider.swift
          test -f clients/ios/PacketTunnel/Info.plist
          test -f clients/ios/PacketTunnel/PacketTunnel.entitlements
          test -f clients/ios/Sources/IRPiOSClient/PacketTunnelConfiguration.swift
          echo 'iOS client source inventory passed'

      - name: Diagnose Xcode target configuration
        run: |
          set +e
          : > "${RUNNER_TEMP}/xcode-target-diagnostics.log"
          for target in IRP IRPPacketTunnel; do
            echo "===== target: $target =====" | tee -a "${RUNNER_TEMP}/xcode-target-diagnostics.log"
            xcodebuild \
              -project "$XCODE_PROJECT" \
              -target "$target" \
              -sdk iphonesimulator \
              -configuration Debug \
              -showBuildSettings >>"${RUNNER_TEMP}/xcode-target-diagnostics.log" 2>&1
            status=$?
            echo "target=$target exit=$status" | tee -a "${RUNNER_TEMP}/xcode-target-diagnostics.log"
          done
          cat "${RUNNER_TEMP}/xcode-target-diagnostics.log"
          exit 0

      - name: Build iOS app and packet tunnel
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme IRP \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Collect Xcode crash diagnostics
        if: ${{ failure() }}
        run: |
          set +e
          echo 'Collecting Xcode crash diagnostics after mandatory build failure.'
          find "$RUNNER_TEMP" -maxdepth 2 -type f \( -name '*xcodebuild*' -o -name '*xcode*log' \) -print -exec sh -c 'echo "===== $1 ====="; tail -n 500 "$1"' _ {} \;
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -newermt '30 minutes ago' -print -exec sh -c 'echo "===== $1 ====="; tail -n 300 "$1"' _ {} \;
          xcrun simctl list devices || true
          xcodebuild -version || true
