name: iOS Full Client

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'clients/ios/**'
      - 'docs/phases/phase-65.md'
      - '.github/workflows/ios-client.yml'
  push:
    branches: [main]
    paths:
      - 'clients/ios/**'
      - 'docs/phases/phase-65.md'
      - '.github/workflows/ios-client.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

defaults:
  run:
    shell: bash

jobs:
  ios-client:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Swift package test
        run: swift test --package-path clients/ios

      - name: Swift package build
        run: swift build --package-path clients/ios
