name: Repository Deep Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-deep-audit-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

defaults:
  run:
    shell: bash

jobs:
  inventory:
    name: Repository inventory and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Deep repository audit
        run: pnpm audit:deep
      - name: Repository contract audit
        run: pnpm validate
      - name: Documentation audit
        run: pnpm validate:docs
      - name: Upload audit report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: repository-deep-audit-${{ github.sha }}
          path: docs/audits/repository-deep-audit.json
          if-no-files-found: error
          retention-days: 14

  workspace:
    name: Workspace / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: inventory
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, test, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Run workspace check
        run: pnpm exec turbo run ${{ matrix.check }}

  runtime:
    name: Product runtime verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: workspace
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Build workspace graph for runtime
        run: pnpm exec turbo run build
      - name: Start API for runtime diagnostics
        env:
          NODE_ENV: test
          API_HOST: 127.0.0.1
          API_PORT: 8080
          TELEMETRY_ENABLED: 'false'
        run: |
          set -euo pipefail
          rm -f /tmp/irp-api.pid /tmp/irp-api.log
          setsid pnpm --filter @irp/api start > /tmp/irp-api.log 2>&1 &
          echo $! > /tmp/irp-api.pid
          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/live >/tmp/irp-api-live.json; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/irp-api.log
            exit 1
          fi
      - name: Strict diagnostics
        env:
          IRP_API_URL: http://127.0.0.1:8080
        run: pnpm diagnostics:strict
      - name: Stop local API before Docker smoke
        if: ${{ always() }}
        run: |
          set -euo pipefail
          pid=''
          if [ -s /tmp/irp-api.pid ]; then
            pid="$(cat /tmp/irp-api.pid)"
          fi

          # Stop the complete process group first; pnpm/node may spawn the
          # actual server as a child.
          if [ -n "$pid" ]; then
            kill -TERM -- "-$pid" 2>/dev/null || true
            kill -TERM "$pid" 2>/dev/null || true
          fi

          wait_for_port_release() {
            for _ in $(seq 1 20); do
              if ! ss -ltn '( sport = :8080 )' | grep -q ':8080'; then
                return 0
              fi
              sleep 0.5
            done
            return 1
          }

          wait_for_port_release || true

          # A spawned child can escape the original pnpm process group. Find
          # only listeners bound to TCP/8080, terminate them, then force-kill
          # only those remaining listeners if graceful shutdown is insufficient.
          listener_pids() {
            ss -ltnp '( sport = :8080 )' 2>/dev/null \
              | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' \
              | sort -u
          }

          for listener_pid in $(listener_pids); do
            kill -TERM "$listener_pid" 2>/dev/null || true
          done
          wait_for_port_release || true

          for listener_pid in $(listener_pids); do
            kill -KILL "$listener_pid" 2>/dev/null || true
          done
          wait_for_port_release || true

          if ss -ltn '( sport = :8080 )' | grep -q ':8080'; then
            echo 'Port 8080 is still occupied after stopping local API' >&2
            ss -ltnp '( sport = :8080 )' >&2 || true
            exit 1
          fi
          rm -f /tmp/irp-api.pid
      - name: Docker runtime smoke
        run: pnpm docker:smoke
      - name: Linux client smoke
        run: |
          set -euo pipefail
          rm -f /tmp/irp-linux-client.log
          pnpm --filter @irp/linux-client start > /tmp/irp-linux-client.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:17861/ >/tmp/irp-linux-client.html; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/irp-linux-client.log
            exit 1
          fi
          grep -q 'Internet Resilience Platform' /tmp/irp-linux-client.html

  final:
    name: Deep audit gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ always() }}
    needs: [inventory, workspace, runtime]
    steps:
      - name: Require all audit stages to pass
        run: |
          set -euo pipefail
          test '${{ needs.inventory.result }}' = success
          test '${{ needs.workspace.result }}' = success
          test '${{ needs.runtime.result }}' = success
          echo 'Repository Deep Audit: PASS'
