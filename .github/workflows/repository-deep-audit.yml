name: Repository Deep Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'

permissions:
  contents: read

concurrency:
  group: repository-deep-audit
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

jobs:
  audit:
    name: Repository inventory and documentation audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deep repository audit
        run: pnpm audit:deep

      - name: Validate documentation
        run: pnpm validate:docs

      - name: Upload audit report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: repository-deep-audit-${{ github.sha }}
          path: docs/audits/repository-deep-audit.json
          if-no-files-found: error
          retention-days: 14

  diagnostics:
    name: Strict API operational diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API and workspace dependencies
        run: pnpm exec turbo run build --filter=@irp/api...

      - name: Start API and run strict diagnostics
        env:
          NODE_ENV: test
          API_HOST: 127.0.0.1
          API_PORT: 8080
          TELEMETRY_ENABLED: 'false'
          IRP_API_URL: http://127.0.0.1:8080
        run: |
          set -euo pipefail
          rm -f /tmp/irp-api.pid /tmp/irp-api.log
          setsid pnpm --filter @irp/api start > /tmp/irp-api.log 2>&1 &
          api_pid=$!
          echo "$api_pid" > /tmp/irp-api.pid

          cleanup() {
            kill -TERM -- "-$api_pid" 2>/dev/null || true
            kill -TERM "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8080/api/v1/live \
              >/tmp/irp-api-live.json 2>/dev/null; then
              ready=true
              break
            fi

            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/irp-api.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat /tmp/irp-api.log
            echo "::error::API did not become ready."
            exit 1
          fi

          cat /tmp/irp-api-live.json
          pnpm diagnostics:strict
