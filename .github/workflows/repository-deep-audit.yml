name: Repository Deep Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-deep-audit-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

defaults:
  run:
    shell: bash

jobs:
  inventory:
    name: Repository inventory and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Deep repository audit
        run: pnpm audit:deep

      - name: Repository contract audit
        run: pnpm validate

      - name: Documentation audit
        run: pnpm validate:docs

      - name: Upload audit report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: repository-deep-audit-${{ github.sha }}
          path: docs/audits/repository-deep-audit.json
          if-no-files-found: error
          retention-days: 14

  workspace:
    name: Workspace / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: inventory
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, test, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Run workspace check
        run: pnpm -r run ${{ matrix.check }}

  runtime:
    name: Product runtime verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: workspace
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Deterministic examples
        run: pnpm examples:smoke

      - name: Strict diagnostics
        run: pnpm diagnostics:strict

      - name: Docker runtime smoke
        run: pnpm docker:smoke

      - name: Linux client smoke
        run: |
          pnpm --filter @irp/linux-client start > /tmp/irp-linux-client.log 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:17861/ >/tmp/irp-linux-client.html; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          grep -q 'Internet Resilience Platform' /tmp/irp-linux-client.html

  final:
    name: Deep audit gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ always() }}
    needs: [inventory, workspace, runtime]
    steps:
      - name: Require all audit stages to pass
        run: |
          test '${{ needs.inventory.result }}' = success
          test '${{ needs.workspace.result }}' = success
          test '${{ needs.runtime.result }}' = success
          echo 'Repository Deep Audit: PASS'
