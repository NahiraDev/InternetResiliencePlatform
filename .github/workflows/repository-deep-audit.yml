name: Repository Deep Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'

permissions:
  contents: read

concurrency:
  group: repository-deep-audit
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

jobs:
  audit:
    name: Repository inventory and documentation audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deep repository audit
        run: pnpm audit:deep

      - name: Validate documentation
        run: pnpm validate:docs

      - name: Upload audit report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: repository-deep-audit-${{ github.sha }}
          path: docs/audits/repository-deep-audit.json
          if-no-files-found: error
          retention-days: 14
