name: Full System Assurance Matrix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-system-assurance-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

defaults:
  run:
    shell: bash

jobs:
  inventory:
    name: Repository-wide assurance inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build repository-wide assurance matrix
        run: pnpm full-system:matrix
      - name: Upload assurance matrix
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: full-system-assurance-matrix
          path: artifacts/full-system-assurance/
          if-no-files-found: error
          retention-days: 14

  deterministic-assurance:
    name: Deterministic system and integration assurance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run deterministic production assurance
        run: pnpm production:assure
      - name: Verify end-to-end integration baseline
        env:
          IRP_INTEGRATION_SKIP_BUILD: '1'
        run: pnpm integration:baseline
      - name: Upload integration baseline evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: integration-baseline
          path: artifacts/integration-baseline/
          if-no-files-found: error
          retention-days: 14

  production-certification-boundary:
    name: Production certification boundary
    needs: [inventory, deterministic-assurance]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 5
    steps:
      - name: Refuse synthetic production certification
        run: |
          set -euo pipefail
          echo 'Real-environment certification is intentionally not synthesized in CI.'
          echo 'Supply independently observed evidence with pnpm production:certify --require-complete when the actual environment has been exercised.'
          exit 0
