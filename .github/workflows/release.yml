name: IRP Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to publish, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: irp-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          git rev-parse --verify "refs/tags/$TAG" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

  gate:
    name: Require green Release Gate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Verify Release Gate passed for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "Tag $RELEASE_TAG resolves to $sha"
          # Fail closed: a release may only be cut from a commit whose Release Gate
          # (CI, System Assurance, runtime labs, CodeQL, deep audit and every client
          # workflow) has completed successfully.
          passed="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/release-gate.yml/runs?head_sha=${sha}&per_page=50" \
            --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')"
          if [ "$passed" -lt 1 ]; then
            echo "No successful Release Gate run exists for $sha. Refusing to publish." >&2
            exit 1
          fi
          echo "Release Gate: PASS for $sha"

  android:
    name: Android APK
    needs: [prepare, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/android
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Build Android debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Normalize Android asset name
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" "${GITHUB_WORKSPACE}/IRP-Android-debug-${RELEASE_TAG}.apk"

      - name: Publish Android asset
        uses: actions/upload-artifact@v7
        with:
          name: IRP-Android-debug
          path: ${{ github.workspace }}/IRP-Android-debug-${{ needs.prepare.outputs.release_tag }}.apk
          if-no-files-found: error

  linux:
    name: Linux bundle
    needs: [prepare, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux client
        run: pnpm --filter @irp/linux-client build

      - name: Package Linux client
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p release/IRP-Linux
          cp -R packages/linux-client/dist release/IRP-Linux/dist
          cp packages/linux-client/package.json release/IRP-Linux/package.json
          tar -C release -czf "IRP-Linux-${RELEASE_TAG}.tar.gz" IRP-Linux

      - name: Publish Linux asset
        uses: actions/upload-artifact@v7
        with:
          name: IRP-Linux
          path: IRP-Linux-${{ needs.prepare.outputs.release_tag }}.tar.gz
          if-no-files-found: error

  macos:
    name: macOS bundle
    needs: [prepare, gate]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS client
        run: pnpm --filter @irp/macos-client build

      - name: Package macOS client
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p release/IRP-macOS/launchd
          cp -R packages/macos-client/dist release/IRP-macOS/dist
          cp packages/macos-client/package.json release/IRP-macOS/package.json
          cp packages/macos-client/launchd/com.nahiradev.irp.macos-client.plist release/IRP-macOS/launchd/
          tar -C release -czf "IRP-macOS-${RELEASE_TAG}.tar.gz" IRP-macOS

      - name: Publish macOS asset
        uses: actions/upload-artifact@v7
        with:
          name: IRP-macOS
          path: IRP-macOS-${{ needs.prepare.outputs.release_tag }}.tar.gz
          if-no-files-found: error

  windows:
    name: Windows bundle
    needs: [prepare, gate]
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows client
        run: pnpm exec tsc -p packages/windows-client/tsconfig.json

      - name: Package Windows client
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p release/IRP-Windows
          cp -R packages/windows-client/dist release/IRP-Windows/dist
          cp packages/windows-client/package.json release/IRP-Windows/package.json
          # This step runs under bash, so bash (not PowerShell) must expand the tag.
          # `$env:RELEASE_TAG` inside the double-quoted string was expanded by bash
          # as `$env` + ":RELEASE_TAG" and failed with "env: unbound variable".
          powershell -NoProfile -Command "Compress-Archive -Path 'release/IRP-Windows' -DestinationPath 'IRP-Windows-${RELEASE_TAG}.zip' -Force"

      - name: Publish Windows asset
        uses: actions/upload-artifact@v7
        with:
          name: IRP-Windows
          path: IRP-Windows-${{ needs.prepare.outputs.release_tag }}.zip
          if-no-files-found: error

  ios-source:
    name: iOS developer bundle
    needs: [prepare, gate]
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Verify Swift package
        run: |
          set -euo pipefail
          swift test --package-path clients/ios
          swift build --package-path clients/ios

      - name: Package iOS source bundle
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: zip -r "IRP-iOS-source-${RELEASE_TAG}.zip" clients/ios docs/phases/phase-65.md docs/phases/phase-66.md

      - name: Publish iOS developer asset
        uses: actions/upload-artifact@v7
        with:
          name: IRP-iOS-source
          path: IRP-iOS-source-${{ needs.prepare.outputs.release_tag }}.zip
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: [prepare, gate, android, linux, macos, windows, ios-source]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: IRP-*
          path: release-assets
          merge-multiple: true

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate Phase 71 release contract
        run: |
          set -euo pipefail
          node scripts/phase71-release.mjs "${{ needs.prepare.outputs.release_tag }}" release-assets

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Validate checksums file
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "IRP $RELEASE_TAG" \
            --generate-notes