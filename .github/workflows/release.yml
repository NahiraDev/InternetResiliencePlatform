name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semantic version tag to release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9.15.0"

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: pnpm validate

      - name: Verify release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${REF_NAME}}"
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Verify release tag commit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "${TAG}^{commit}")" = "${GITHUB_SHA}"

      - name: Verify required checks for release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          CHECKS_JSON="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?per_page=100")"

          node --input-type=module <<'NODE'
          const checks = JSON.parse(process.env.CHECKS_JSON);
          const required = ['Validate repository'];
          const failed = required.filter((name) => {
            const matches = checks.check_runs.filter((run) => run.name === name);
            return matches.length === 0 || !matches.some((run) => run.conclusion === 'success');
          });
          if (failed.length) {
            console.error(`Required checks missing or unsuccessful: ${failed.join(', ')}`);
            process.exit(1);
          }
          NODE
        env:
          CHECKS_JSON: ${{ steps.tag.outputs.tag && '' }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --verify-tag \
            --title "${TAG}" \
            --generate-notes
