name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: pnpm validate

      - name: Verify release tag
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse "${TAG}^{commit}")" = "${GITHUB_SHA}"

      - name: Wait for CI quality gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 40); do
            CHECKS_JSON="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?per_page=100")"
            export CHECKS_JSON

            RESULT="$(node --input-type=module <<'NODE'
            const checks = JSON.parse(process.env.CHECKS_JSON);
            const matches = checks.check_runs.filter((run) => run.name === 'Validate repository');
            if (matches.some((run) => run.conclusion === 'success')) {
              process.stdout.write('success');
              process.exit(0);
            }
            if (matches.some((run) => ['failure', 'cancelled', 'timed_out', 'action_required'].includes(run.conclusion))) {
              process.stdout.write('failure');
              process.exit(0);
            }
            process.stdout.write('pending');
            NODE
            )"

            case "${RESULT}" in
              success)
                echo 'CI quality gate succeeded.'
                exit 0
                ;;
              failure)
                echo 'CI quality gate failed or was cancelled.'
                exit 1
                ;;
              pending)
                echo "CI quality gate is still pending (attempt ${attempt}/40)."
                sleep 15
                ;;
            esac
          done

          echo 'Timed out waiting for CI quality gate.'
          exit 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --verify-tag \
            --title "${TAG}" \
            --generate-notes
