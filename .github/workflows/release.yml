name: IRP Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to publish, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: irp-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          git rev-parse --verify "refs/tags/$TAG" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

  gate:
    name: Require green Release Gate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Verify Release Gate passed for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "Tag $RELEASE_TAG resolves to $sha"
          # Fail closed: a release may only be cut from a commit whose Release Gate
          # (CI, System Assurance, runtime labs, CodeQL, deep audit and every client
          # workflow) has completed successfully.
          passed="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/release-gate.yml/runs?head_sha=${sha}&per_page=50" \
            --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')"
          if [ "$passed" -lt 1 ]; then
            echo "No successful Release Gate run exists for $sha. Refusing to publish." >&2
            exit 1
          fi
          echo "Release Gate: PASS for $sha"

  android:
    name: Android APK
    needs: [prepare, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/android
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Build Android debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Normalize Android asset name
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" "${GITHUB_WORKSPACE}/IRP-Android-debug-${RELEASE_TAG}.apk"

      - name: Publish Android asset
        uses: actions/upload-artifact@v7
        with:
          name: IRP-Android-debug
          path: ${{ github.workspace }}/IRP-Android-debug-${{ needs.prepare.outputs.release_tag }}.apk
          if-no-files-found: error

  linux:
    name: Linux bundle
    needs: [prepare, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux client
        run: pnpm --filter @irp/linux-client build

      - name: Package Linux client
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          # Bundle the client with its installable runtime dependency closure so
          # `node dist/main.js` works from the extracted bundle. `pnpm deploy
          # --legacy` copies the package files and injects a real node_modules
          # for the workspace dependencies (not symlinks).
          pnpm --filter @irp/linux-client deploy --prod --legacy release/IRP-Linux
          rm -f release/IRP-Linux/README.md
          # The published bundle is the runtime, not the test suite.
          rm -f release/IRP-Linux/dist/*.test.js \
                release/IRP-Linux/dist/*.test.d.ts \
                release/IRP-Linux/dist/*.integration.test.js \
                release/IRP-Linux/dist/*.integration.test.d.ts
          # Packaging guards: fail closed if the bundle is not runnable.
          test -f release/IRP-Linux/dist/main.js
          test -f release/IRP-Linux/package.json
          test -d release/IRP-Linux/node_modules/@irp/resilience-runtime
          tar -C release -czf "IRP-Linux-${RELEASE_TAG}.tar.gz" IRP-Linux

      - name: Smoke test Linux bundle
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          rm -rf /tmp/irp-linux-smoke && mkdir -p /tmp/irp-linux-smoke
          tar -C /tmp/irp-linux-smoke -xzf "IRP-Linux-${RELEASE_TAG}.tar.gz"
          node /tmp/irp-linux-smoke/IRP-Linux/dist/main.js &
          CLIENT_PID=$!
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:17861/health >/tmp/irp-health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test -s /tmp/irp-health.json
          grep -q '"runtime"' /tmp/irp-health.json
          kill "$CLIENT_PID"
          wait "$CLIENT_PID" 2>/dev/null || true
          echo "Linux bundle smoke test: PASS"

      - name: Publish Linux asset
        uses: actions/upload-artifact@v7
        with:
          name: IRP-Linux
          path: IRP-Linux-${{ needs.prepare.outputs.release_tag }}.tar.gz
          if-no-files-found: error

  macos:
    name: macOS bundle
    needs: [prepare, gate]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS client
        run: pnpm --filter @irp/macos-client build

      - name: Package macOS client
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p release/IRP-macOS/launchd
          cp -R packages/macos-client/dist release/IRP-macOS/dist
          cp packages/macos-client/package.json release/IRP-macOS/package.json
          cp packages/macos-client/launchd/com.nahiradev.irp.macos-client.plist release/IRP-macOS/launchd/
          # The launchd unit must point at the shipped entrypoint.
          grep -q 'dist/index.js' release/IRP-macOS/launchd/com.nahiradev.irp.macos-client.plist
          tar -C release -czf "IRP-macOS-${RELEASE_TAG}.tar.gz" IRP-macOS
          # Packaging guard: the tarball must contain the runtime and the unit.
          tar -tzf "IRP-macOS-${RELEASE_TAG}.tar.gz" | grep -q 'IRP-macOS/dist/index.js'
          tar -tzf "IRP-macOS-${RELEASE_TAG}.tar.gz" | grep -q 'IRP-macOS/launchd/'

      - name: Publish macOS asset
        uses: actions/upload-artifact@v7
        with:
          name: IRP-macOS
          path: IRP-macOS-${{ needs.prepare.outputs.release_tag }}.tar.gz
          if-no-files-found: error

  windows:
    name: Windows bundle
    needs: [prepare, gate]
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows client
        run: pnpm exec tsc -p packages/windows-client/tsconfig.json

      - name: Package Windows client
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p release/IRP-Windows
          cp -R packages/windows-client/dist release/IRP-Windows/dist
          cp packages/windows-client/package.json release/IRP-Windows/package.json
          # Compress-Archive writes backslash entry names, which extract badly
          # with non-Windows tools. Python's zipfile writes forward slashes.
          # This step runs under bash, so bash expands ${RELEASE_TAG} (the
          # previous `$env:RELEASE_TAG` form failed with "env: unbound variable").
          python -c "import shutil; shutil.make_archive('IRP-Windows-${RELEASE_TAG}', 'zip', 'release')"
          # Packaging guard: forward-slash entry names and a runnable layout.
          ZIP_NAME="IRP-Windows-${RELEASE_TAG}.zip" python - <<'PY'
          import os, zipfile
          names = zipfile.ZipFile(os.environ['ZIP_NAME']).namelist()
          assert not any('\\' in n for n in names), names
          assert 'IRP-Windows/dist/index.js' in names, names
          assert 'IRP-Windows/package.json' in names, names
          PY

      - name: Publish Windows asset
        uses: actions/upload-artifact@v7
        with:
          name: IRP-Windows
          path: IRP-Windows-${{ needs.prepare.outputs.release_tag }}.zip
          if-no-files-found: error

  ios-source:
    name: iOS developer bundle
    needs: [prepare, gate]
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Verify Swift package
        run: |
          set -euo pipefail
          swift test --package-path clients/ios
          swift build --package-path clients/ios

      - name: Package iOS source bundle
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          # Ship the tracked source only: the SwiftPM build/test products under
          # clients/ios/.build are regenerated by anyone building the package
          # and must not be distributed (v0.2.0 shipped ~6,400 such files).
          zip -r "IRP-iOS-source-${RELEASE_TAG}.zip" clients/ios docs/phases/phase-65.md docs/phases/phase-66.md -x 'clients/ios/.build/*'
          # Packaging guard: no generated build products in the bundle.
          ! unzip -l "IRP-iOS-source-${RELEASE_TAG}.zip" | grep -q 'clients/ios/.build/'
          unzip -l "IRP-iOS-source-${RELEASE_TAG}.zip" | grep -q 'clients/ios/Package.swift'

      - name: Publish iOS developer asset
        uses: actions/upload-artifact@v7
        with:
          name: IRP-iOS-source
          path: IRP-iOS-source-${{ needs.prepare.outputs.release_tag }}.zip
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: [prepare, gate, android, linux, macos, windows, ios-source]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: IRP-*
          path: release-assets
          merge-multiple: true

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate Phase 71 release contract
        run: |
          set -euo pipefail
          node scripts/phase71-release.mjs "${{ needs.prepare.outputs.release_tag }}" release-assets

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Validate checksums file
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "IRP $RELEASE_TAG" \
            --generate-notes