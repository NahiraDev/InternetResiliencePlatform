name: IRP Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10'

      - name: Build Android debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Publish Android asset
        uses: actions/upload-artifact@v7
        with:
          name: IRP-Android-debug
          path: clients/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  linux:
    name: Linux bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux client
        run: pnpm --filter @irp/linux-client build

      - name: Package Linux client
        run: |
          mkdir -p release/IRP-Linux
          cp -R packages/linux-client/dist release/IRP-Linux/dist
          cp packages/linux-client/package.json release/IRP-Linux/package.json
          tar -C release -czf "IRP-Linux-${GITHUB_REF_NAME}.tar.gz" IRP-Linux

      - name: Publish Linux asset
        uses: actions/upload-artifact@v7
        with:
          name: IRP-Linux
          path: IRP-Linux-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  macos:
    name: macOS bundle
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS client
        run: pnpm --filter @irp/macos-client build

      - name: Package macOS client
        run: |
          mkdir -p release/IRP-macOS/launchd
          cp -R packages/macos-client/dist release/IRP-macOS/dist
          cp packages/macos-client/package.json release/IRP-macOS/package.json
          cp packages/macos-client/launchd/com.nahiradev.irp.macos-client.plist release/IRP-macOS/launchd/
          tar -C release -czf "IRP-macOS-${GITHUB_REF_NAME}.tar.gz" IRP-macOS

      - name: Publish macOS asset
        uses: actions/upload-artifact@v7
        with:
          name: IRP-macOS
          path: IRP-macOS-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  windows:
    name: Windows bundle
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows client
        run: pnpm exec tsc -p packages/windows-client/tsconfig.json

      - name: Package Windows client
        run: |
          mkdir -p release/IRP-Windows
          cp -R packages/windows-client/dist release/IRP-Windows/dist
          cp packages/windows-client/package.json release/IRP-Windows/package.json
          powershell -NoProfile -Command "Compress-Archive -Path 'release/IRP-Windows' -DestinationPath 'IRP-Windows-${env:GITHUB_REF_NAME}.zip' -Force"

      - name: Publish Windows asset
        uses: actions/upload-artifact@v7
        with:
          name: IRP-Windows
          path: IRP-Windows-${{ github.ref_name }}.zip
          if-no-files-found: error

  ios-source:
    name: iOS developer bundle
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Swift package
        run: |
          swift test --package-path clients/ios
          swift build --package-path clients/ios

      - name: Package iOS source bundle
        run: zip -r "IRP-iOS-source-${GITHUB_REF_NAME}.zip" clients/ios docs/phases/phase-65.md docs/phases/phase-66.md

      - name: Publish iOS developer asset
        uses: actions/upload-artifact@v7
        with:
          name: IRP-iOS-source
          path: IRP-iOS-source-${{ github.ref_name }}.zip
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: [android, linux, macos, windows, ios-source]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download Android asset
        uses: actions/download-artifact@v8
        with:
          name: IRP-Android-debug
          path: release-assets/android

      - name: Download Linux asset
        uses: actions/download-artifact@v8
        with:
          name: IRP-Linux
          path: release-assets/linux

      - name: Download macOS asset
        uses: actions/download-artifact@v8
        with:
          name: IRP-macOS
          path: release-assets/macos

      - name: Download Windows asset
        uses: actions/download-artifact@v8
        with:
          name: IRP-Windows
          path: release-assets/windows

      - name: Download iOS developer asset
        uses: actions/download-artifact@v8
        with:
          name: IRP-iOS-source
          path: release-assets/ios

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release assets
        run: |
          test -n "$(find release-assets/android -type f -name '*.apk' -print -quit)"
          test -n "$(find release-assets/linux -type f -name '*.tar.gz' -print -quit)"
          test -n "$(find release-assets/macos -type f -name '*.tar.gz' -print -quit)"
          test -n "$(find release-assets/windows -type f -name '*.zip' -print -quit)"
          test -n "$(find release-assets/ios -type f -name '*.zip' -print -quit)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/android/*.apk release-assets/linux/*.tar.gz release-assets/macos/*.tar.gz release-assets/windows/*.zip release-assets/ios/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "IRP $RELEASE_TAG" \
            --generate-notes
