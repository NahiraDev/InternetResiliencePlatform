name: Runtime Lab

on:
  workflow_dispatch:
  push:
    paths:
      - 'ops/observability/**'
      - 'tools/runtime-lab/**'
      - 'packages/gateway-registry/**'
      - 'packages/resilience-runtime/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  runtime-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start runtime lab
        run: docker compose -f ops/observability/docker-compose.yml up -d

      - name: Wait for runtime readiness
        run: |
          ready=false
          for i in {1..60}; do
            if curl -fsS --max-time 5 http://localhost:8080/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          curl -fsS --max-time 5 http://localhost:8080/health
          curl -fsS --max-time 5 http://localhost:8080/ready
          curl -fsS --max-time 5 http://localhost:8080/report

      - name: Validate metrics
        run: |
          ready=false
          for i in {1..30}; do
            metrics="$(curl -fsS --max-time 5 http://localhost:9464/metrics || true)"
            if printf '%s\n' "$metrics" | grep -q '^irp_runtime_lab_up 1$' \
              && printf '%s\n' "$metrics" | grep -q '^irp_package_calls_total'; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          printf '%s\n' "$metrics" | grep -q '^irp_runtime_lab_up 1$'
          printf '%s\n' "$metrics" | grep -q '^irp_package_calls_total'

      - name: Validate Prometheus target
        run: |
          curl -fsS http://localhost:9090/-/ready

      - name: Validate Grafana
        run: |
          curl -fsS http://localhost:3001/api/health

      - name: Validate Tempo
        run: |
          curl -fsS http://localhost:3200/ready

      - name: Collect logs
        if: always()
        run: docker compose -f ops/observability/docker-compose.yml logs --no-color

      - name: Shutdown
        if: always()
        run: docker compose -f ops/observability/docker-compose.yml down -v
