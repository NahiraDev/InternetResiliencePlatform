name: Runtime Lab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ops/observability/**'
      - 'tools/runtime-lab/**'
      - 'packages/gateway-registry/**'
      - 'packages/resilience-runtime/**'
      - '.github/workflows/runtime-lab.yml'
      - '.github/workflows/public-runtime-lab.yml'
      - 'scripts/docker-smoke.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'ops/observability/**'
      - 'tools/runtime-lab/**'
      - 'packages/gateway-registry/**'
      - 'packages/resilience-runtime/**'
      - '.github/workflows/runtime-lab.yml'
      - '.github/workflows/public-runtime-lab.yml'
      - 'scripts/docker-smoke.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: runtime-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'
  COMPOSE_FILE: ops/observability/docker-compose.yml

defaults:
  run:
    shell: bash

jobs:
  runtime-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start runtime lab
        run: docker compose -f "$COMPOSE_FILE" up -d --no-build

      - name: Verify runtime containers
        run: |
          docker compose -f "$COMPOSE_FILE" ps -a
          lab_id="$(docker compose -f "$COMPOSE_FILE" ps -q lab)"
          test -n "$lab_id"
          docker inspect --format='lab status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restart={{.RestartCount}} error={{.State.Error}}' "$lab_id"

      - name: Wait for runtime readiness
        run: |
          ready=false
          for i in {1..60}; do
            lab_id="$(docker compose -f "$COMPOSE_FILE" ps -q lab)"
            running="$(docker inspect -f '{{.State.Running}}' "$lab_id" 2>/dev/null || echo false)"
            exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$lab_id" 2>/dev/null || echo unknown)"
            restart_count="$(docker inspect -f '{{.RestartCount}}' "$lab_id" 2>/dev/null || echo unknown)"

            echo "--- readiness attempt $i/60 running=$running exit=$exit_code restarts=$restart_count ---"
            if curl -fsS --max-time 5 http://127.0.0.1:8080/ready >/tmp/runtime-ready.json 2>/tmp/runtime-ready.err; then
              ready=true
              cat /tmp/runtime-ready.json
              break
            fi

            cat /tmp/runtime-ready.json 2>/dev/null || true
            cat /tmp/runtime-ready.err 2>/dev/null || true
            docker compose -f "$COMPOSE_FILE" ps -a

            if [ "$running" != "true" ]; then
              echo 'Runtime lab container exited before readiness.'
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo '::error::Runtime lab did not become ready.'
            echo '--- compose ps ---'
            docker compose -f "$COMPOSE_FILE" ps -a
            echo '--- lab inspect ---'
            lab_id="$(docker compose -f "$COMPOSE_FILE" ps -q lab)"
            docker inspect --format='status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restart={{.RestartCount}} error={{.State.Error}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' "$lab_id" || true
            echo '--- lab logs ---'
            docker compose -f "$COMPOSE_FILE" logs --no-color --tail=2000 lab || true
            echo '--- health ---'
            curl -sS --max-time 5 http://127.0.0.1:8080/health || true
            echo '--- ready ---'
            curl -sS --max-time 5 http://127.0.0.1:8080/ready || true
            echo '--- report ---'
            curl -sS --max-time 5 http://127.0.0.1:8080/report || true
            exit 1
          fi

          curl -fsS --max-time 5 http://127.0.0.1:8080/health
          curl -fsS --max-time 5 http://127.0.0.1:8080/ready
          curl -fsS --max-time 5 http://127.0.0.1:8080/report

      - name: Validate metrics
        run: |
          ready=false
          for i in {1..30}; do
            metrics="$(curl -fsS --max-time 5 http://127.0.0.1:9464/metrics || true)"
            if printf '%s\n' "$metrics" | grep -q '^irp_runtime_lab_up 1$' \
              && printf '%s\n' "$metrics" | grep -q '^irp_package_calls_total'; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          printf '%s\n' "$metrics" | grep -q '^irp_runtime_lab_up 1$'
          printf '%s\n' "$metrics" | grep -q '^irp_package_calls_total'

      - name: Validate observability readiness
        run: |
          wait_http_ok() {
            local name="$1"
            local url="$2"
            local attempts="${3:-60}"
            local delay="${4:-2}"

            for i in $(seq 1 "$attempts"); do
              echo "--- $name readiness attempt $i/$attempts ---"
              if response="$(curl -fsS --max-time 5 "$url" 2>/tmp/observability-ready.err)"; then
                printf '%s\n' "$response"
                return 0
              fi

              cat /tmp/observability-ready.err 2>/dev/null || true
              sleep "$delay"
            done

            echo "::error::$name did not become ready at $url"
            echo '--- compose ps ---'
            docker compose -f "$COMPOSE_FILE" ps -a
            echo "--- $name container logs ---"
            case "$name" in
              Prometheus) docker compose -f "$COMPOSE_FILE" logs --no-color --tail=500 prometheus || true ;;
              Grafana) docker compose -f "$COMPOSE_FILE" logs --no-color --tail=500 grafana || true ;;
              Tempo) docker compose -f "$COMPOSE_FILE" logs --no-color --tail=500 tempo || true ;;
            esac
            return 1
          }

          wait_http_ok Prometheus http://127.0.0.1:9090/-/ready 60 2
          wait_http_ok Grafana http://127.0.0.1:3001/api/health 60 2
          wait_http_ok Tempo http://127.0.0.1:3200/ready 60 2

      - name: Collect logs
        if: always()
        run: |
          docker compose -f "$COMPOSE_FILE" ps -a
          docker compose -f "$COMPOSE_FILE" logs --no-color --tail=2000

      - name: Shutdown
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v --remove-orphans
