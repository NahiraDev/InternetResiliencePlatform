name: Lint

on:
  push:
    branches:
      - main
      - phase-0-bootstrap
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint placeholders
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lint
        run: ./scripts/lint.sh
