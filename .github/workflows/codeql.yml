# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '31 17 * * 3'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: java-kotlin
          build-mode: manual
        - language: javascript-typescript
          build-mode: none
        - language: swift
          build-mode: manual
        # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
        # Use `c-cpp` to analyze code written in C, C++ or both
        # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # To learn more about changing the languages that are analyzed or customizing the build mode for your analysis,
        # see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        # If you are analyzing a compiled language, you can modify the 'build-mode' for that language to customize how
        # your codebase is analyzed, see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # The repository validator (scripts/validate-repository.mjs) requires every workflow to pin
    # the same pnpm and Node toolchain as CI; JavaScript/TypeScript analysis also benefits from
    # resolved workspace dependencies.
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.21.0

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies with frozen lockfile
      if: matrix.language == 'javascript-typescript'
      run: pnpm install --frozen-lockfile

    - name: Setup Java for Android sources
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle for Android sources
      if: matrix.language == 'java-kotlin'
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.10'

    # Add any setup steps before running the `github/codeql-action/init` action.
    # This includes steps like installing compilers or runtimes (`actions/setup-node`
    # or others). This is typically only required for manual builds.
    # - name: Setup runtime (example)
    #   uses: actions/setup-example@v1

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # If the analyze step fails for one of the languages you are analyzing with
    # "We were unable to automatically build your code", modify the matrix above
    # to set the build mode to "manual" for that language. Then modify this step
    # to build your code.
    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    - name: Build Android sources for CodeQL
      if: matrix.language == 'java-kotlin'
      working-directory: clients/android
      run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

    # Issue #420: this repository uses the advanced CodeQL model. GitHub default
    # setup must stay disabled, otherwise the two models overlap and SARIF
    # processing is rejected as a configuration mismatch. The check fails closed
    # only for the contradictory state; an unreadable settings endpoint is
    # reported as a warning because the workflow token may not be allowed to
    # read repository security settings.
    - name: Verify GitHub default CodeQL setup is disabled
      if: matrix.language == 'actions'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        response="$(gh api "repos/${GITHUB_REPOSITORY}/code-scanning/default-setup" 2>&1)" || {
          echo "::warning::Could not read the CodeQL default setup state (${response}); the advanced workflow remains this repository's CodeQL model."
          exit 0
        }
        state="$(printf '%s' "$response" | jq -r '.state // "unknown"')"
        if [ "$state" != "not-configured" ] && [ "$state" != "disabled" ]; then
          echo "::error::GitHub default CodeQL setup is '${state}' while the advanced workflow is authoritative. Disable default setup so exactly one CodeQL model is active (issue #420)."
          exit 1
        fi
        echo "GitHub default CodeQL setup state: ${state}"

    - name: Select and verify Xcode
      if: matrix.language == 'swift'
      run: |
        set -euo pipefail
        # Prefer a known-good toolchain; selecting an installed compatible
        # Xcode is a compatibility fix, not a validation bypass.
        for candidate in \
          /Applications/Xcode_16.3.app/Contents/Developer \
          /Applications/Xcode_16.2.app/Contents/Developer \
          /Applications/Xcode_16.4.app/Contents/Developer \
          /Applications/Xcode_16.app/Contents/Developer \
          /Applications/Xcode_26.2.app/Contents/Developer \
          /Applications/Xcode_26.1.app/Contents/Developer \
          /Applications/Xcode_26.0.app/Contents/Developer \
          /Applications/Xcode.app/Contents/Developer; do
          if [ -d "$candidate" ]; then
            sudo xcode-select -s "$candidate"
            break
          fi
        done
        test -x "$(xcode-select -p)/usr/bin/xcodebuild"
        xcodebuild -version
        swift --version

    - name: Regenerate Xcode project (XcodeGen)
      if: matrix.language == 'swift'
      run: |
        set -euo pipefail
        # clients/ios/project.yml is the canonical project definition; the
        # generated project must contain every client source file.
        brew install xcodegen
        (cd clients/ios && xcodegen generate)

    # Issue #420: `autobuild` reported success for a run whose Xcode build had
    # failed with compiler errors, producing a false-green security gate. The
    # Swift analysis now runs in manual mode with a mandatory build, so a
    # compiler error fails the CodeQL job instead of being ignored.
    - name: Build Swift sources for CodeQL
      if: matrix.language == 'swift'
      run: |
        set -euo pipefail
        swift build --package-path clients/ios
        xcodebuild \
          -project clients/ios/IRP.xcodeproj \
          -scheme IRP \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -configuration Debug \
          -jobs 1 \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=- \
          build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
