name: Release Gate

on:
  workflow_run:
    workflows:
      - CI
      - System Assurance
      - Linux Primary Device
      - Runtime Lab
      - CodeQL Advanced
      - Repository Deep Audit
      - Public Runtime Lab
      - Android Client
      - iOS Full Client
      - iOS Network Integration
      - macOS Full Client
      - Windows Full Client
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Main commit SHA to verify'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-gate-${{ github.event.workflow_run.head_sha || inputs.commit_sha }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

jobs:
  verify:
    name: Verify release-blocking evidence
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Test release gate fail-closed behavior
        run: node --test scripts/release-gate.test.mjs

      - name: Verify release commit and required workflow results
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || inputs.commit_sha }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" || {
            echo 'Release Gate checkout is not current main.' >&2
            exit 1
          }

          test "$(git rev-parse HEAD)" = "$HEAD_SHA" || {
            echo "Release Gate must certify the current main commit. Expected: $HEAD_SHA" >&2
            echo "Checked out: $(git rev-parse HEAD)" >&2
            exit 1
          }

          workflows=(
            "ci.yml"
            "system-assurance.yml"
            "linux-primary-device.yml"
            "runtime-lab.yml"
            "codeql.yml"
            "repository-deep-audit.yml"
            "public-runtime-lab.yml"
            "android-client.yml"
            "ios-client.yml"
            "ios-network-integration.yml"
            "macos-client.yml"
            "windows-client.yml"
          )

          for workflow in "${workflows[@]}"; do
            echo "=== verifying $workflow for $HEAD_SHA ==="
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${HEAD_SHA}&event=push&per_page=20")"
            latest_completed="$(jq -c '[.workflow_runs[] | select(.status == "completed")] | sort_by(.created_at) | last // empty' <<<"$runs")"

            if [ -z "$latest_completed" ]; then
              echo "BLOCKED $workflow: no completed push run for exact SHA $HEAD_SHA" >&2
              exit 1
            fi

            run_id="$(jq -r '.id' <<<"$latest_completed")"
            conclusion="$(jq -r '.conclusion // "unknown"' <<<"$latest_completed")"
            created_at="$(jq -r '.created_at // "unknown"' <<<"$latest_completed")"
            updated_at="$(jq -r '.updated_at // "unknown"' <<<"$latest_completed")"

            echo "workflow=$workflow run=$run_id conclusion=$conclusion created_at=$created_at updated_at=$updated_at"

            if [ "$conclusion" != "success" ]; then
              echo "FAIL $workflow: latest completed exact-SHA run concluded '$conclusion'" >&2
              exit 1
            fi

            echo "PASS $workflow"
          done

          echo
          echo "Release Gate: PASS"
          echo "Certified commit: $HEAD_SHA"
