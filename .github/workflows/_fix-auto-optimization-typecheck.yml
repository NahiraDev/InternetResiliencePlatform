name: Temporary auto-optimization typecheck fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exactOptionalPropertyTypes fix
        shell: bash
        run: |
          set -euo pipefail
          file=packages/auto-optimization/src/index.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/auto-optimization/src/index.ts')
          s = p.read_text()
          old = """      windowStartedAt: resetWindow ? now : current.windowStartedAt,\n      lastAppliedAt: countAgainstBudget ? now : current.lastAppliedAt,\n      lastOutcome: outcome,\n      lastRecommendationId: recommendationId,\n"""
          new = """      windowStartedAt: resetWindow ? now : current.windowStartedAt,\n      ...(countAgainstBudget || current.lastAppliedAt !== undefined\n        ? { lastAppliedAt: countAgainstBudget ? now : current.lastAppliedAt }\n        : {}),\n      ...(outcome !== undefined ? { lastOutcome: outcome } : {}),\n      lastRecommendationId: recommendationId,\n"""
          if old not in s:
              raise SystemExit('Expected recordOutcome block not found; refusing to modify repository')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- packages/auto-optimization/src/index.ts

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/_fix-auto-optimization-typecheck.yml
          git add packages/auto-optimization/src/index.ts .github/workflows/_fix-auto-optimization-typecheck.yml
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix(auto-optimization): preserve optional state properties'
          git push
