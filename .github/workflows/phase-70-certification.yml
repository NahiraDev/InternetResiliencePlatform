name: Phase 70 v1.0 Production Certification

on:
  pull_request:
    paths:
      - 'PROJECT_STATE.md'
      - 'ROADMAP.md'
      - 'README.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/phase70-certification.mjs'
      - 'ops/release/phase-70-certification.json'
      - 'docs/phases/phase-70.md'
      - '.github/workflows/phase-70-certification.yml'
      - 'clients/**'
      - 'packages/**'
      - 'apps/**'
  push:
    branches: [main]
    paths:
      - 'PROJECT_STATE.md'
      - 'ROADMAP.md'
      - 'README.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/phase70-certification.mjs'
      - 'ops/release/phase-70-certification.yml'
      - 'clients/**'
      - 'packages/**'
      - 'apps/**'

permissions:
  contents: read

concurrency:
  group: phase-70-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

jobs:
  certification-contract:
    name: v1.0 certification contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Phase 70 certification contract
        run: pnpm phase70:certify

  # Repository validation, linting, typechecking, tests and build are owned by
  # the primary CI workflow. Certification remains focused on its unique
  # fail-closed evidence contract rather than duplicating generic CI gates.
