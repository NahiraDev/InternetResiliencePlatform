name: Phase 69 lockfile sync

on:
  push:
    branches:
      - feat/phase-69-production-hardening

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.21.0 --activate

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit generated lockfile and remove temporary sync workflow
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git rm .github/workflows/phase69-lockfile-sync.yml
          git commit -m 'fix: synchronize pnpm workspace lockfile'
          git push
