name: Repository Health

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.21.0

jobs:
  foundation:
    name: Foundation / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [validate, docs, typecheck, lint, test, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Repository validation
        if: matrix.check == 'validate'
        run: pnpm validate
      - name: Documentation validation
        if: matrix.check == 'docs'
        run: pnpm validate:docs
      - name: Build workspace graph for typecheck
        if: matrix.check == 'typecheck'
        run: pnpm -r run build
      - name: Typecheck all workspaces
        if: matrix.check == 'typecheck'
        run: pnpm -r run typecheck
      - name: Lint all workspaces
        if: matrix.check == 'lint'
        run: pnpm -r run lint
      - name: Build workspace graph for tests
        if: matrix.check == 'test'
        run: pnpm -r run build
      - name: Test all workspaces
        if: matrix.check == 'test'
        run: pnpm -r run test
      - name: Build all workspaces
        if: matrix.check == 'build'
        run: pnpm -r run build

  workspace-contracts:
    name: Workspace contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit every workspace manifest
        run: node scripts/repository-contract-audit.mjs
      - name: Verify dependency graph
        run: pnpm list --depth -1 --recursive

  runtime:
    name: Runtime smoke / Linux
    runs-on: ubuntu-latest
    needs: [foundation, workspace-contracts]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build everything
        run: pnpm -r run build
      - name: Example smoke tests
        run: pnpm examples:smoke
      - name: Strict operational diagnostics
        run: pnpm diagnostics:strict
      - name: Linux client smoke
        run: |
          pnpm --filter @irp/linux-client start > /tmp/irp-linux-client.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:17861/ >/tmp/irp-linux-client.html; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          grep -q 'Internet Resilience Platform' /tmp/irp-linux-client.html

  docker:
    name: Docker runtime smoke
    runs-on: ubuntu-latest
    needs: [foundation, workspace-contracts]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Docker smoke
        run: pnpm docker:smoke

  failure-diagnostics:
    name: Failure diagnostics
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    needs: [foundation, workspace-contracts, runtime, docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Capture environment
        run: |
          node --version || true
          pnpm --version || true
          uname -a || true
          ip -brief address || true
          ip -brief route || true
          resolvectl status || true
