name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Show runtime versions
        run: |
          node --version
          pnpm --version
          docker --version
          docker compose version

      - name: Require checked-in pnpm lockfile
        run: |
          test -f pnpm-lock.yaml || {
            echo '::error::pnpm-lock.yaml is missing.'
            echo 'Generate it with pnpm install --lockfile-only and commit the resulting lockfile before enabling frozen installs.'
            exit 1
          }

      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Validate repository integrity
        run: pnpm validate

      - name: Validate documentation integrity
        run: pnpm validate:docs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Fresh coverage
        run: pnpm exec turbo run test --force -- --coverage

      - name: Build
        run: pnpm build

      - name: Smoke test deterministic examples
        run: pnpm examples:smoke

      - name: Run production Docker runtime smoke test
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/docker-smoke.sh

      - name: Show Docker Compose logs
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: docker compose logs --no-color || true

      - name: Remove Docker Compose runtime
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: docker compose down --volumes --remove-orphans || true

      - name: Create trusted source artifact
        if: github.ref == 'refs/heads/main'
        run: git archive --format=tar.gz --output="${RUNNER_TEMP}/irp-source.tar.gz" "${GITHUB_SHA}"

      - name: Upload trusted source artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: irp-source-${{ github.sha }}
          path: ${{ runner.temp }}/irp-source.tar.gz
          if-no-files-found: error
          retention-days: 7
