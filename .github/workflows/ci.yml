name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

defaults:
  run:
    shell: bash

jobs:
  linux-primary:
    name: Linux primary device (Debian 13)
    runs-on: ubuntu-latest
    container: node:24-trixie
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Debian build tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git dpkg systemd
          rm -rf /var/lib/apt/lists/*

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          node --version
          pnpm --version

      - name: Require checked-in pnpm lockfile
        run: test -f pnpm-lock.yaml

      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Linux client typecheck
        run: pnpm --filter @irp/linux-client typecheck

      - name: Linux client lint
        run: pnpm --filter @irp/linux-client lint

      - name: Linux client tests
        run: pnpm --filter @irp/linux-client test

      - name: Linux client build
        run: pnpm --filter @irp/linux-client build

      - name: Verify systemd unit contract
        run: |
          node_bin="$(command -v node)"
          test -n "$node_bin"
          if [ "$node_bin" != "/usr/bin/node" ]; then
            ln -sf "$node_bin" /usr/bin/node
          fi
          test -x /usr/bin/node
          if ! getent group irp >/dev/null 2>&1; then
            groupadd --system irp
          fi
          if ! getent passwd irp >/dev/null 2>&1; then
            useradd --system --gid irp --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin irp
          fi
          systemd-analyze verify packages/linux-client/systemd/irp-linux-client.service
          grep -Fq 'User=irp' packages/linux-client/systemd/irp-linux-client.service
          grep -Fq 'Group=irp' packages/linux-client/systemd/irp-linux-client.service
          grep -Fq 'NoNewPrivileges=true' packages/linux-client/systemd/irp-linux-client.service
          grep -Fq 'ProtectSystem=strict' packages/linux-client/systemd/irp-linux-client.service

      - name: Build Debian package
        run: |
          bash scripts/build-linux-deb.sh
          test -s dist/linux/irp-linux-client_0.1.0_amd64.deb
          test -s dist/linux/irp-linux-client_0.1.0_amd64.deb.sha256

      - name: Verify Debian package metadata and contents
        run: |
          dpkg-deb --info dist/linux/irp-linux-client_0.1.0_amd64.deb
          dpkg-deb --contents dist/linux/irp-linux-client_0.1.0_amd64.deb | grep -Fq './usr/lib/irp/linux-client/dist/index.js'
          dpkg-deb --contents dist/linux/irp-linux-client_0.1.0_amd64.deb | grep -Fq './usr/lib/systemd/system/irp-linux-client.service'
          sha256sum -c dist/linux/irp-linux-client_0.1.0_amd64.deb.sha256

      - name: Smoke test packaged Linux client
        run: |
          rm -rf /tmp/irp-linux-package
          mkdir -p /tmp/irp-linux-package
          dpkg-deb --extract dist/linux/irp-linux-client_0.1.0_amd64.deb /tmp/irp-linux-package
          node --check /tmp/irp-linux-package/usr/lib/irp/linux-client/dist/index.js
          test -f /tmp/irp-linux-package/usr/lib/systemd/system/irp-linux-client.service

  validate:
    name: Validate repository
    needs: linux-primary
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Show runtime versions
        run: |
          node --version
          pnpm --version
          docker --version
          docker compose version

      - name: Require checked-in pnpm lockfile
        run: |
          test -f pnpm-lock.yaml || {
            echo '::error::pnpm-lock.yaml is missing.'
            echo 'Generate it with pnpm install --lockfile-only and commit the resulting lockfile before enabling frozen installs.'
            exit 1
          }

      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Validate repository integrity
        run: pnpm validate

      - name: Validate documentation integrity
        run: pnpm validate:docs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Fresh coverage
        run: pnpm exec turbo run test --force -- --coverage

      - name: Build
        run: pnpm build

      - name: Smoke test deterministic examples
        run: pnpm examples:smoke

      - name: Run production Docker runtime smoke test
        run: bash scripts/docker-smoke.sh

      - name: Show Docker Compose logs
        if: always()
        env:
          POSTGRES_PASSWORD: irp_ci_diagnostics_postgres_password
          JWT_SECRET: irp_ci_diagnostics_jwt_secret_012345678901234567890123456789
          REMOTE_CLIENT_CREDENTIAL_KEY: irp_ci_diagnostics_credential_key_012345678901234567890123
          REMOTE_CLIENT_REFRESH_KEY: irp_ci_diagnostics_refresh_key_012345678901234567890123
        run: docker compose logs --no-color

      - name: Remove Docker Compose runtime
        if: always()
        env:
          POSTGRES_PASSWORD: irp_ci_diagnostics_postgres_password
          JWT_SECRET: irp_ci_diagnostics_jwt_secret_012345678901234567890123456789
          REMOTE_CLIENT_CREDENTIAL_KEY: irp_ci_diagnostics_credential_key_012345678901234567890123
          REMOTE_CLIENT_REFRESH_KEY: irp_ci_diagnostics_refresh_key_012345678901234567890123
        run: docker compose down --volumes --remove-orphans

      - name: Create trusted source artifact
        if: github.ref == 'refs/heads/main'
        run: git archive --format=tar.gz --output="${RUNNER_TEMP}/irp-source.tar.gz" "${GITHUB_SHA}"

      - name: Upload trusted source artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: irp-source-${{ github.sha }}
          path: ${{ runner.temp }}/irp-source.tar.gz
          if-no-files-found: error
          retention-days: 7
