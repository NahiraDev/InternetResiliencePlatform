name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      - name: Validate repository integrity
        run: pnpm validate

      # ============================================================
      # Static analysis
      # ============================================================

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # ============================================================
      # Tests
      # ============================================================

      - name: Test
        run: pnpm test

      - name: Fresh coverage
        run: pnpm exec turbo run test --force -- --coverage

      # ============================================================
      # Application build
      # ============================================================

      - name: Build
        run: pnpm build

      # ============================================================
      # Docker Compose validation
      # ============================================================

      - name: Validate Docker Compose
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag

      - name: Build Docker image
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

      - name: Inspect Docker image
        if: github.event_name == 'pull_request'
        run: |
          docker image inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Start Docker smoke test container
        if: github.event_name == 'pull_request'
        run: |
          docker run \
            --detach \
            --name irp-ci-smoke \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Wait for Docker container startup
        if: github.event_name == 'pull_request'
        run: |
          sleep 5

      - name: Verify Docker container
        if: github.event_name == 'pull_request'
        run: |
          STATUS="$(docker inspect \
            --format='{{.State.Status}}' \
            irp-ci-smoke)"

          echo "Container status: ${STATUS}"

          test "${STATUS}" = "running"

      - name: Verify Docker container user
        if: github.event_name == 'pull_request'
        run: |
          USER_ID="$(docker exec irp-ci-smoke id -u)"

          echo "Container UID: ${USER_ID}"

          test "${USER_ID}" != "0"

      - name: Verify runtime filesystem permissions
        if: github.event_name == 'pull_request'
        run: |
          docker exec irp-ci-smoke sh -c '
            set -eu

            echo "Current user:"
            id

            echo "Working directory:"
            pwd

            echo "Working directory permissions:"
            ls -ld .

            if [ -d "/app/.cache" ]; then
              echo "/app/.cache:"
              ls -ld /app/.cache
            fi

            if [ -d "/app/.cache/node" ]; then
              echo "/app/.cache/node:"
              ls -ld /app/.cache/node
            fi

            if [ -d "/app/.cache/node/corepack" ]; then
              echo "/app/.cache/node/corepack:"
              ls -ld /app/.cache/node/corepack
            fi
          '

      - name: Verify pnpm runtime
        if: github.event_name == 'pull_request'
        run: |
          docker exec irp-ci-smoke sh -c '
            set -eu

            if command -v pnpm >/dev/null 2>&1; then
              echo "pnpm:"
              command -v pnpm
              pnpm --version
            elif command -v corepack >/dev/null 2>&1; then
              echo "Corepack:"
              command -v corepack
              corepack --version
            else
              echo "Neither pnpm nor Corepack is available in the runtime image."
              exit 1
            fi
          '
      - name: Show Docker logs
        if: always() && github.event_name == 'pull_request'
        run: |
          docker logs irp-ci-smoke || true

      - name: Stop Docker smoke test container
        if: always() && github.event_name == 'pull_request'
        run: |
          docker stop \
            irp-ci-smoke \
            || true

      - name: Remove Docker smoke test container
        if: always() && github.event_name == 'pull_request'
        run: |
          docker rm \
            irp-ci-smoke \
            || true

      - name: Attest Build Provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.docker-build.outputs.digest }}
          push-to-registry: true

      - name: Remove Docker image
        if: always() && github.event_name == 'pull_request'
        run: |
          docker image rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            || true
