name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9.15.0"

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Show runtime versions
        run: |
          node --version
          pnpm --version
          docker --version
          docker compose version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository integrity
        run: pnpm validate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Fresh coverage
        run: pnpm exec turbo run test --force -- --coverage

      - name: Build
        run: pnpm build

      - name: Validate Docker Compose
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for PR smoke test
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: irp-ci-smoke:pr
          provenance: false
          sbom: false

      - name: Start Docker smoke test container
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          docker run --detach --name irp-ci-smoke irp-ci-smoke:pr

      - name: Wait for Docker container startup
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            STATUS="$(docker inspect --format='{{.State.Status}}' irp-ci-smoke 2>/dev/null || true)"
            case "${STATUS}" in
              running) exit 0 ;;
              exited|dead) docker logs irp-ci-smoke || true; exit 1 ;;
            esac
            sleep 1
          done
          docker logs irp-ci-smoke || true
          exit 1

      - name: Verify Docker container
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          STATUS="$(docker inspect --format='{{.State.Status}}' irp-ci-smoke)"
          test "${STATUS}" = "running"

      - name: Verify Docker container is non-root
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          USER_ID="$(docker exec irp-ci-smoke id -u)"
          test "${USER_ID}" != "0"

      - name: Verify runtime filesystem permissions
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          docker exec irp-ci-smoke sh -c '
            set -eu
            for path in \
              /app/.cache \
              /app/.cache/node \
              /app/.cache/node/corepack \
              /app/.cache/node/corepack/v1
            do
              if [ -e "${path}" ]; then
                ls -ld "${path}"
              fi
            done
            CACHE_DIR="/app/.cache/node/corepack/v1"
            if [ -d "${CACHE_DIR}" ]; then
              TEST_FILE="${CACHE_DIR}/.irp-ci-write-test"
              touch "${TEST_FILE}"
              rm -f "${TEST_FILE}"
            fi
          '

      - name: Verify pnpm runtime
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          docker exec irp-ci-smoke sh -c 'pnpm --version'

      - name: Show Docker logs
        if: always() && github.event_name == 'pull_request'
        run: docker logs irp-ci-smoke || true

      - name: Remove Docker smoke test container
        if: always() && github.event_name == 'pull_request'
        run: docker rm -f irp-ci-smoke || true
