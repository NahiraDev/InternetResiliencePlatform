name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: "24"
  PNPM_VERSION: "9.15.0"

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Show runtime versions
        run: |
          node --version
          pnpm --version
          docker --version
          docker compose version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository integrity
        run: pnpm validate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Fresh coverage
        run: pnpm exec turbo run test --force -- --coverage

      - name: Build
        run: pnpm build

      - name: Validate Docker Compose
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag

      - name: Build Docker image
        id: docker-build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

      - name: Verify Docker image
        if: github.event_name == 'pull_request'
        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker image inspect "${IMAGE_TAG}"

      - name: Start Docker smoke test container
        if: github.event_name == 'pull_request'
        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker run \
            --detach \
            --name irp-ci-smoke \
            "${IMAGE_TAG}"

      - name: Wait for Docker container startup
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          timeout 30 bash -c '
            until [ "$(docker inspect --format="{{.State.Status}}" irp-ci-smoke 2>/dev/null || true)" = "running" ]; do
              sleep 1
            done
          '

      - name: Verify Docker container
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          STATUS="$(docker inspect --format='{{.State.Status}}' irp-ci-smoke)"
          echo "Container status: ${STATUS}"
          test "${STATUS}" = "running"

      - name: Verify Docker container is non-root
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          USER_ID="$(docker exec irp-ci-smoke id -u)"
          echo "Container UID: ${USER_ID}"
          test "${USER_ID}" != "0"

      - name: Verify runtime filesystem permissions
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          docker exec irp-ci-smoke sh -c '
            set -eu
            echo "Runtime identity:"
            id
            echo "Working directory:"
            pwd
            ls -ld .
            echo "Application cache hierarchy:"
            for path in \
              /app/.cache \
              /app/.cache/node \
              /app/.cache/node/corepack \
              /app/.cache/node/corepack/v1
            do
              if [ -e "${path}" ]; then
                ls -ld "${path}"
              else
                echo "${path}: not present"
              fi
            done
            CACHE_DIR="/app/.cache/node/corepack/v1"
            if [ -d "${CACHE_DIR}" ]; then
              TEST_FILE="${CACHE_DIR}/.irp-ci-write-test"
              touch "${TEST_FILE}"
              rm -f "${TEST_FILE}"
              echo "Corepack cache is writable."
            fi
          '

      - name: Verify pnpm and Corepack runtime
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          docker exec irp-ci-smoke sh -c '
            set -eu
            if command -v pnpm >/dev/null 2>&1; then
              echo "pnpm executable:"
              command -v pnpm
              echo "pnpm version:"
              pnpm --version
            else
              echo "pnpm is not available in runtime."
              exit 1
            fi
            if command -v corepack >/dev/null 2>&1; then
              echo "Corepack executable:"
              command -v corepack
              echo "Corepack version:"
              corepack --version
            fi
          '

      - name: Show Docker container state
        if: always() && github.event_name == 'pull_request'
        run: |
          docker inspect irp-ci-smoke || true

      - name: Show Docker logs
        if: always() && github.event_name == 'pull_request'
        run: |
          docker logs irp-ci-smoke || true

      - name: Stop Docker smoke test container
        if: always() && github.event_name == 'pull_request'
        run: |
          docker stop irp-ci-smoke || true

      - name: Remove Docker smoke test container
        if: always() && github.event_name == 'pull_request'
        run: |
          docker rm irp-ci-smoke || true

      - name: Remove Docker image
        if: always() && github.event_name == 'pull_request'
        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          docker image rm "${IMAGE_TAG}" || true

      - name: Attest Build Provenance
        if: github.event_name != 'pull_request' && steps.docker-build.outputs.digest != ''
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.docker-build.outputs.digest }}
          push-to-registry: true
