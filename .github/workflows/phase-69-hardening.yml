name: Phase 69 Production Hardening

on:
  pull_request:
    paths:
      - 'PROJECT_STATE.md'
      - 'ROADMAP.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'ops/release/**'
      - 'docs/phases/phase-69.md'
      - 'docs/release/**'
      - '.github/CI_CONTRACT.md'
      - '.github/workflows/**'
      - 'clients/**'
      - 'packages/**'
      - 'apps/**'
  push:
    branches: [main]
    paths:
      - 'PROJECT_STATE.md'
      - 'ROADMAP.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'ops/release/**'
      - 'docs/phases/phase-69.md'
      - 'docs/release/**'
      - '.github/CI_CONTRACT.md'
      - '.github/workflows/**'
      - 'clients/**'
      - 'packages/**'
      - 'apps/**'

permissions:
  contents: read

concurrency:
  group: phase-69-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

jobs:
  readiness:
    name: Production hardening readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Phase 69 readiness contract
        run: pnpm phase69:readiness

  # Repository validation, linting, typechecking, tests and build are owned by
  # the primary CI workflow. Keeping them here would execute the same gates a
  # second time for the same commit without adding certification signal.
