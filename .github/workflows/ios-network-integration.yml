name: iOS Network Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'clients/ios/**'
      - 'docs/phases/phase-65.md'
      - 'docs/phases/phase-66.md'
      - '.github/workflows/ios-network-integration.yml'
  push:
    branches: [main]
    paths:
      - 'clients/ios/**'
      - 'docs/phases/phase-65.md'
      - 'docs/phases/phase-66.md'
      - '.github/workflows/ios-network-integration.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

defaults:
  run:
    shell: bash

jobs:
  ios-network-integration:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Validate Swift package
        run: |
          swift test --package-path clients/ios
          swift build --package-path clients/ios

      - name: Validate Xcode project graph
        run: |
          test -f clients/ios/IRP.xcodeproj/project.pbxproj
          xcodebuild -list -project clients/ios/IRP.xcodeproj
          python3 - <<'PY'
          from pathlib import Path
          text = Path('clients/ios/IRP.xcodeproj/project.pbxproj').read_text()
          required = [
              'name = IRP;',
              'name = IRPPacketTunnel;',
              'com.apple.product-type.application',
              'com.apple.product-type.app-extension',
              'A10000010000000000000009 /* PacketTunnelProvider.swift in Sources */',
              'R10000010000000000000003 /* Embed Foundation Extensions */',
              'target = E10000010000000000000002;',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing Xcode project graph entries: {missing}')
          if 'files = (A10000010000000000000009, A10000010000000000000006);' in text:
              raise SystemExit('PacketTunnelConfiguration.swift must not be compiled by IRPPacketTunnel')
          print('Xcode project graph contract passed')
          PY

      - name: Validate packet tunnel entitlement
        run: |
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.networking.networkextension:0' clients/ios/PacketTunnel/PacketTunnel.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.networking.networkextension:0' clients/ios/PacketTunnel/PacketTunnel.entitlements)" = 'packet-tunnel-provider'

      - name: Validate extension metadata
        run: |
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' clients/ios/PacketTunnel/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' clients/ios/PacketTunnel/Info.plist)" = 'com.apple.networkextension.packet-tunnel'
