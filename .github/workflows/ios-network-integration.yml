name: iOS Network Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'clients/ios/**'
      - 'docs/phases/phase-65.md'
      - 'docs/phases/phase-66.md'
      - '.github/workflows/ios-network-integration.yml'
  push:
    branches: [main]
    paths:
      - 'clients/ios/**'
      - 'docs/phases/phase-65.md'
      - 'docs/phases/phase-66.md'
      - '.github/workflows/ios-network-integration.yml'

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

defaults:
  run:
    shell: bash

jobs:
  ios-network-integration:
    # macOS 15 provides the supported Xcode 16 toolchain for this project.
    # This workflow now owns both the Phase 65 Swift package checks and the
    # Phase 66 packet-tunnel/Xcode integration checks; keeping a second iOS
    # workflow would execute the same Swift tests/build for the same change.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Validate Swift package
        run: |
          swift test --package-path clients/ios
          swift build --package-path clients/ios

      - name: Validate Xcode project
        run: |
          xcodebuild -list -project clients/ios/IRP.xcodeproj
          xcodebuild -project clients/ios/IRP.xcodeproj \
            -target IRPPacketTunnel \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Validate packet tunnel entitlement
        run: |
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.networking.networkextension:0' clients/ios/PacketTunnel/PacketTunnel.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.networking.networkextension:0' clients/ios/PacketTunnel/PacketTunnel.entitlements)" = 'packet-tunnel-provider'

      - name: Validate extension metadata
        run: |
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' clients/ios/PacketTunnel/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' clients/ios/PacketTunnel/Info.plist)" = 'com.apple.networkextension.packet-tunnel'
