name: Product Reality Check

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'phase/**'

permissions:
  contents: read

concurrency:
  group: product-reality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

jobs:
  static-and-runtime-reality:
    name: Product reality / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify Linux client package independently
        run: |
          pnpm --filter @irp/linux-client typecheck
          pnpm --filter @irp/linux-client test
          pnpm --filter @irp/linux-client build

      - name: Verify Linux host networking is observable
        run: |
          set -euo pipefail
          command -v ip
          ip -brief link
          ip -brief address
          ip -brief route
          if command -v resolvectl >/dev/null 2>&1; then
            resolvectl status
          else
            echo 'resolvectl is unavailable on this runner; continuing because the client has an unavailable-state boundary.'
          fi
          getent hosts github.com
          curl -fsS --max-time 15 https://github.com/robots.txt >/dev/null

      - name: Exercise compiled Linux client control surface
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' &
          import { LinuxSystem, LinuxClientServer } from './packages/linux-client/dist/index.js';
          const server = new LinuxClientServer(new LinuxSystem());
          await server.start(17861, '127.0.0.1');
          process.on('SIGTERM', async () => { await server.stop(); process.exit(0); });
          NODE
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          for i in {1..20}; do
            if curl -fsS --max-time 2 http://127.0.0.1:17861/ >/tmp/irp-client.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/irp-client.html
          grep -F 'Internet Resilience Platform' /tmp/irp-client.html
          grep -F 'Autonomous mode:' /tmp/irp-client.html

          curl -fsS -X POST -d 'autonomousMode=true' http://127.0.0.1:17861/policy -o /dev/null -w '%{http_code}\n' | grep -Fx '303'
          curl -fsS http://127.0.0.1:17861/ | grep -F 'Autonomous mode: <strong>enabled</strong>'

          curl -fsS -X POST -d 'autonomousMode=false' http://127.0.0.1:17861/policy -o /dev/null -w '%{http_code}\n' | grep -Fx '303'
          curl -fsS http://127.0.0.1:17861/ | grep -F 'Autonomous mode: <strong>disabled</strong>'

          if curl -fsS --max-time 2 http://127.0.0.2:17861/ >/dev/null 2>&1; then
            echo '::error::Linux client unexpectedly accepted a non-loopback address.'
            exit 1
          fi

      - name: Verify production Docker runtime
        run: bash scripts/docker-smoke.sh

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo '=== Network interfaces ==='
          ip -brief address || true
          echo '=== Routes ==='
          ip -brief route || true
          echo '=== Resolver ==='
          resolvectl status || true
          echo '=== Docker ==='
          docker compose ps -a || true
          docker compose logs --no-color --tail=500 || true

      - name: Cleanup Docker runtime
        if: always()
        run: docker compose down --volumes --remove-orphans || true
