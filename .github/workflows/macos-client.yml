name: macOS Full Client

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/macos-client/**'
      - '.github/workflows/macos-client.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/macos-client/**'
      - '.github/workflows/macos-client.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

defaults:
  run:
    shell: bash

jobs:
  macos-client:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck macOS client
        run: pnpm --filter @irp/macos-client typecheck

      - name: Lint macOS client
        run: pnpm --filter @irp/macos-client lint

      - name: Test macOS client
        run: pnpm --filter @irp/macos-client test

      - name: Build macOS client
        run: pnpm --filter @irp/macos-client build

      - name: Verify native command surface
        run: |
          test "$(uname -s)" = "Darwin"
          command -v ifconfig
          command -v route
          command -v scutil
          node -e "import('./packages/macos-client/dist/index.js').then(async ({MacOSSystem}) => { const s = await new MacOSSystem().snapshot(); if (s.platform !== 'darwin') process.exit(2); console.log(JSON.stringify({platform:s.platform, capturedAt:s.capturedAt})); })"

      - name: Verify launchd contract
        run: |
          plutil -lint packages/macos-client/launchd/com.nahiradev.irp.macos-client.plist
          grep -q '<key>KeepAlive</key>' packages/macos-client/launchd/com.nahiradev.irp.macos-client.plist
          grep -q '<key>RunAtLoad</key>' packages/macos-client/launchd/com.nahiradev.irp.macos-client.plist
