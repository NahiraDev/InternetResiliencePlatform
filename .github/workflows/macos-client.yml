name: macOS Full Client

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/macos-client/**'
      - '.github/workflows/macos-client.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/macos-client/**'
      - '.github/workflows/macos-client.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

defaults:
  run:
    shell: bash

jobs:
  macos-client:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Synchronize workspace lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pnpm install --lockfile-only --ignore-scripts
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pnpm-lock.yaml
            git commit -m 'chore(lockfile): sync workspace importers'
            git push origin HEAD:main
          fi

      - name: Verify workspace lockfile
        if: github.event_name == 'pull_request'
        run: |
          pnpm install --lockfile-only --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Typecheck macOS client
        run: pnpm --filter @irp/macos-client typecheck

      - name: Lint macOS client
        run: pnpm --filter @irp/macos-client lint

      - name: Test macOS client
        run: pnpm --filter @irp/macos-client test

      - name: Build macOS client
        run: pnpm --filter @irp/macos-client build

      - name: Verify native command surface
        run: |
          test "$(uname -s)" = "Darwin"
          command -v ifconfig
          command -v route
          command -v scutil
          command -v networksetup
          node -e "import('./packages/macos-client/dist/index.js').then(async ({MacOSSystem}) => { const s = await new MacOSSystem().snapshot(); if (s.platform !== 'darwin') process.exit(2); for (const key of ['interfaces','routes','dns','networkServices','vpnServices']) if (s[key].startsWith('unavailable:')) process.exit(3); console.log(JSON.stringify({platform:s.platform, capturedAt:s.capturedAt, networkServices:s.networkServices.split('\n').length, vpnServices:s.vpnServices.split('\n').length})); }).catch((e)=>{console.error(e);process.exit(1);})"

      - name: Verify launchd contract
        run: |
          plutil -lint packages/macos-client/launchd/com.nahiradev.irp.macos-client.plist
          grep -q '<key>KeepAlive</key>' packages/macos-client/launchd/com.nahiradev.irp.macos-client.plist
          grep -q '<key>RunAtLoad</key>' packages/macos-client/launchd/com.nahiradev.irp.macos-client.plist
