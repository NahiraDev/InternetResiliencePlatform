name: macOS Full Client

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/macos-client/**'
      - '.github/workflows/macos-client.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/macos-client/**'
      - '.github/workflows/macos-client.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: macos-client-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

defaults:
  run:
    shell: bash

jobs:
  macos-client:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify workspace lockfile
        run: |
          pnpm install --lockfile-only --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Typecheck macOS client
        run: pnpm --filter @irp/macos-client typecheck

      - name: Lint macOS client
        run: pnpm --filter @irp/macos-client lint

      - name: Test macOS client
        run: pnpm --filter @irp/macos-client test

      - name: Build macOS client
        run: pnpm --filter @irp/macos-client build

      - name: Verify native command surface
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          command -v ifconfig
          command -v route
          command -v scutil
          command -v networksetup
          node -e "import('./packages/macos-client/dist/index.js').then(async ({MacOSSystem}) => { const s = await new MacOSSystem().snapshot(); if (s.platform !== 'darwin') process.exit(2); for (const key of ['interfaces','routes','dns','networkServices','vpnServices']) { if (!s[key] || s[key].startsWith('unavailable:')) process.exit(3); } console.log(JSON.stringify({platform:s.platform, capturedAt:s.capturedAt, networkServices:s.networkServices.split('\\n').length, vpnServices:s.vpnServices.split('\\n').length})); }).catch((error)=>{console.error(error);process.exit(1);})"

      - name: Verify launchd contract
        run: |
          plutil -lint packages/macos-client/launchd/com.nahiradev.irp.macos-client.plist
          grep -q '<key>KeepAlive</key>' packages/macos-client/launchd/com.nahiradev.irp.macos-client.plist
          grep -q '<key>RunAtLoad</key>' packages/macos-client/launchd/com.nahiradev.irp.macos-client.plist
