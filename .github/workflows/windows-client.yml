name: Windows Full Client

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-client-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

defaults:
  run:
    shell: bash

jobs:
  windows-client:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Windows client
        run: pnpm exec tsc -p packages/windows-client/tsconfig.json --noEmit

      - name: Lint Windows client
        run: pnpm exec eslint packages/windows-client/src --ext .ts

      - name: Test Windows client
        run: pnpm --filter @irp/windows-client test

      - name: Build Windows client
        run: pnpm exec tsc -p packages/windows-client/tsconfig.json

      - name: Verify native command surface
        shell: pwsh
        run: |
          if ($env:OS -ne 'Windows_NT') { throw 'Windows runner required' }
          if (-not (Get-Command ipconfig -ErrorAction SilentlyContinue)) { throw 'ipconfig missing' }
          if (-not (Get-Command route -ErrorAction SilentlyContinue)) { throw 'route missing' }
          if (-not (Get-Command netsh -ErrorAction SilentlyContinue)) { throw 'netsh missing' }
          node --input-type=module -e "import('./packages/windows-client/dist/index.js').then(async ({WindowsSystem}) => { const s = await new WindowsSystem().snapshot(); if (s.platform !== 'win32') { console.error(JSON.stringify({platform:s.platform,reason:'Windows runtime required'})); process.exit(2); } const keys = ['interfaces','routes','dns']; const commands = {interfaces:'ipconfig.exe',routes:'route.exe',dns:'netsh.exe'}; const failed = keys.filter((key) => !s[key] || s[key].startsWith('unavailable:')); if (failed.length) { const codes = ['ENOENT','EACCES','ETIMEDOUT','ENOBUFS','ERR_CHILD_PROCESS_STDIO_MAXBUFFER']; const unavailable = failed.map((key) => { const detail = String(s[key] || ''); const errorCode = codes.find((code) => detail.includes(code)) || (detail.includes('Command failed:') ? 'NONZERO_EXIT' : 'UNKNOWN'); return {field:key,command:commands[key],errorCode}; }); console.error(JSON.stringify({unavailable})); process.exit(3); } console.log(JSON.stringify({platform:s.platform,capturedAt:s.capturedAt,verified:keys})); }).catch((error) => { console.error(error); process.exit(1); })"
