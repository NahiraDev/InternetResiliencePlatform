name: Issue triage

on:
  issues:
    types:
      - opened
      - edited
      - reopened

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.21.0"
  SUMMARY_MARKER: "<!-- irp:issue-summary -->"
  MAX_ISSUE_BODY_CHARS: "12000"

jobs:
  triage:
    name: Automatic issue triage
    if: >-
      github.event.issue.pull_request == null &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve issue payload
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            > "${RUNNER_TEMP}/issue.json"

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const issue = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/issue.json`, 'utf8'));
          const maxBodyChars = Number(process.env.MAX_ISSUE_BODY_CHARS);
          const body = typeof issue.body === 'string' ? issue.body : '';
          const truncatedBody = body.length > maxBodyChars
            ? `${body.slice(0, maxBodyChars)}\n\n[Issue body truncated for processing.]`
            : body;

          const payload = {
            number: issue.number,
            title: issue.title ?? '',
            body: truncatedBody,
            url: issue.html_url ?? '',
          };

          writeFileSync(
            `${process.env.RUNNER_TEMP}/issue-prompt.txt`,
            JSON.stringify(payload, null, 2),
            'utf8',
          );
          NODE

      - name: Automatic labels
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          TITLE="$(jq -r '.title // ""' "${RUNNER_TEMP}/issue.json")"
          LABELS="$(jq -r '[.labels[]?.name] | join("\n")' "${RUNNER_TEMP}/issue.json")"

          ensure_label() {
            local label="$1"
            if ! grep -Fxq "${label}" <<<"${LABELS}"; then
              gh label create "${label}" --repo "${REPOSITORY}" --force >/dev/null
            fi
          }

          apply_label() {
            local label="$1"
            ensure_label "${label}"
            if ! grep -Fxq "${label}" <<<"${LABELS}"; then
              gh issue edit "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --add-label "${label}" >/dev/null
              LABELS="${LABELS}\n${label}"
            fi
          }

          apply_label "needs-triage"

          shopt -s nocasematch
          case "${TITLE}" in
            bug:\ *|bug\ *)
              apply_label "bug"
              ;;
            feat:\ *|feature:\ *|feature\ request:*)
              apply_label "enhancement"
              ;;
          esac
          shopt -u nocasematch

      - name: Prepare deterministic triage summary
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const issue = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/issue.json`, 'utf8'));
          const title = String(issue.title ?? '').trim() || 'Untitled issue';
          const rawBody = String(issue.body ?? '').trim();
          const body = rawBody.length > 4000
            ? `${rawBody.slice(0, 4000)}\n\n[Issue body truncated in summary.]`
            : rawBody;

          const summary = [
            process.env.SUMMARY_MARKER,
            '## Automated Issue Triage Summary',
            '',
            '### Problem',
            `The issue is titled **${title.replaceAll('*', '\\*')}**.`,
            '',
            body || 'No additional issue description was provided.',
            '',
            '### Impact',
            'Impact is based only on the information supplied in the issue and should be confirmed during implementation triage.',
            '',
            '### Requested outcome',
            'Review the issue description, reproduce or verify the reported behavior where applicable, and implement the requested outcome according to the repository engineering and security gates.',
            '',
            '_Generated deterministically by GitHub Actions. No external AI service is required for issue triage._',
          ].join('\n');

          writeFileSync(
            `${process.env.RUNNER_TEMP}/summary-comment.json`,
            JSON.stringify({ body: summary }),
            'utf8',
          );
          NODE

      - name: Create or update summary comment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          COMMENT_ID="$(gh api \
            --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --paginate \
            --jq '.[] | select((.body // "") | contains("<!-- irp:issue-summary -->")) | .id' \
            "/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            | tail -n 1)"

          if [[ -n "${COMMENT_ID}" ]]; then
            gh api \
              --method PATCH \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${REPOSITORY}/issues/comments/${COMMENT_ID}" \
              --input "${RUNNER_TEMP}/summary-comment.json" >/dev/null
            echo "Updated existing issue summary comment ${COMMENT_ID}."
          else
            gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              --input "${RUNNER_TEMP}/summary-comment.json" >/dev/null
            echo "Created issue summary comment."
          fi
