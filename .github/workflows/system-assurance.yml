name: System Assurance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-assurance-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'

defaults:
  run:
    shell: bash

jobs:
  assurance:
    name: Canonical Runtime System Assurance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run system assurance
        run: pnpm production:assure

      - name: Upload assurance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: system-assurance-${{ github.sha }}
          path: artifacts/production-assurance/
          if-no-files-found: error
          retention-days: 30
