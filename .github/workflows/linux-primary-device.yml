name: Linux Primary Device

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'
  DEBIAN_FRONTEND: noninteractive

defaults:
  run:
    shell: bash

jobs:
  debian-primary-device:
    name: Debian 13 primary device acceptance
    runs-on: ubuntu-24.04
    container:
      image: debian:13
    timeout-minutes: 30

    steps:
      - name: Install CI prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git xz-utils dpkg systemd systemd-sysv libatomic1

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node.js runtime for Debian contract
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg
          curl -fsSL https://deb.nodesource.com/setup_24.x -o /tmp/nodesource_setup_24.x
          bash /tmp/nodesource_setup_24.x
          apt-get install -y --no-install-recommends nodejs
          node --version
          command -v node
          dpkg-query -W -f='${Version}\n' nodejs
          node --version | grep -Eq '^v24\.'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Linux client
        run: |
          pnpm --filter @irp/linux-client typecheck
          pnpm --filter @irp/linux-client lint
          pnpm --filter @irp/linux-client test
          pnpm --filter @irp/linux-client build

      - name: Build Debian package
        run: |
          pnpm linux:package
          test -f dist/linux/irp-linux-client_0.1.1_amd64.deb
          test -f dist/linux/irp-linux-client_0.1.1_amd64.deb.sha256

      - name: Verify Debian package metadata
        run: |
          dpkg-deb --info dist/linux/irp-linux-client_0.1.1_amd64.deb
          dpkg-deb --contents dist/linux/irp-linux-client_0.1.1_amd64.deb
          dpkg-deb --field dist/linux/irp-linux-client_0.1.1_amd64.deb Package | grep -Fx 'irp-linux-client'
          dpkg-deb --field dist/linux/irp-linux-client_0.1.1_amd64.deb Architecture | grep -Fx 'amd64'
          dpkg-deb --field dist/linux/irp-linux-client_0.1.1_amd64.deb Depends | grep -F 'nodejs'

      - name: Verify checksum
        run: sha256sum -c dist/linux/irp-linux-client_0.1.1_amd64.deb.sha256

      - name: Install Debian package
        run: |
          dpkg -i dist/linux/irp-linux-client_0.1.1_amd64.deb
          dpkg-query -W -f='${Status}\n' irp-linux-client | grep -Fx 'install ok installed'
          test -f /usr/lib/irp/linux-client/dist/index.js
          test -f /usr/lib/irp/linux-client/dist/main.js
          test -f /usr/lib/systemd/system/irp-linux-client.service
          test -d /usr/lib/irp/linux-client/node_modules
          id irp
          getent group irp

      - name: Verify installed systemd unit contract
        run: |
          node_bin="$(command -v node)"
          test -n "$node_bin"
          if [ "$node_bin" != "/usr/bin/node" ]; then
            ln -sf "$node_bin" /usr/bin/node
          fi
          test -x /usr/bin/node
          systemd-analyze verify /usr/lib/systemd/system/irp-linux-client.service
          grep -Fx 'User=irp' /usr/lib/systemd/system/irp-linux-client.service
          grep -Fx 'Group=irp' /usr/lib/systemd/system/irp-linux-client.service
          grep -Fx 'NoNewPrivileges=true' /usr/lib/systemd/system/irp-linux-client.service
          grep -Fx 'ProtectSystem=strict' /usr/lib/systemd/system/irp-linux-client.service
          grep -Fx 'ProtectHome=true' /usr/lib/systemd/system/irp-linux-client.service
          grep -Fq 'dist/main.js' /usr/lib/systemd/system/irp-linux-client.service
          grep -Fq 'WorkingDirectory=/usr/lib/irp/linux-client' /usr/lib/systemd/system/irp-linux-client.service

      - name: Run installed Linux client smoke test
        run: |
          set -euo pipefail

          # postinst may start the unit; stop it so this smoke owns the port.
          systemctl stop irp-linux-client.service 2>/dev/null || true
          systemctl reset-failed irp-linux-client.service 2>/dev/null || true

          cd /usr/lib/irp/linux-client

          echo '=== package layout ==='
          ls -la
          echo '=== node_modules/@irp ==='
          ls -la node_modules/@irp || true
          echo '=== package.json ==='
          cat package.json

          /usr/bin/node --check dist/index.js
          /usr/bin/node --check dist/main.js

          # In-process smoke: load the installed graph, start the HTTP surface,
          # assert the contract HTML, then stop cleanly. Avoids background PID races.
          /usr/bin/node --input-type=module <<'SMOKE'
          import { runLinuxClient } from './dist/index.js';

          const server = await runLinuxClient();
          try {
            const response = await fetch('http://127.0.0.1:17861/');
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }
            const body = await response.text();
            if (!body.includes('IRP Linux Client')) {
              throw new Error('response missing IRP Linux Client');
            }
            if (!body.includes('Linux Full Client')) {
              throw new Error('response missing Linux Full Client');
            }
            console.log('linux-client-smoke-ok');
          } finally {
            await server.stop();
          }
          SMOKE

      - name: Upload Debian package evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: irp-linux-debian-primary-device-${{ github.sha }}
          path: |
            dist/linux/irp-linux-client_0.1.1_amd64.deb
            dist/linux/irp-linux-client_0.1.1_amd64.deb.sha256
          if-no-files-found: error
          retention-days: 14
