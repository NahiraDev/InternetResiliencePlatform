name: Linux Primary Device

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'
  DEBIAN_FRONTEND: noninteractive

defaults:
  run:
    shell: bash

jobs:
  debian-primary-device:
    name: Debian 13 primary device acceptance
    runs-on: ubuntu-24.04
    container:
      image: debian:13
    timeout-minutes: 30

    steps:
      - name: Install CI prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git xz-utils dpkg systemd systemd-sysv

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js 24
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y --no-install-recommends nodejs
          node --version
          command -v node

      - name: Install pnpm 11.21.0
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Linux client
        run: |
          pnpm --filter @irp/linux-client typecheck
          pnpm --filter @irp/linux-client lint
          pnpm --filter @irp/linux-client test
          pnpm --filter @irp/linux-client build

      - name: Build Debian package
        run: |
          pnpm linux:package
          test -f dist/linux/irp-linux-client_0.1.0_amd64.deb
          test -f dist/linux/irp-linux-client_0.1.0_amd64.deb.sha256

      - name: Verify Debian package metadata
        run: |
          dpkg-deb --info dist/linux/irp-linux-client_0.1.0_amd64.deb
          dpkg-deb --contents dist/linux/irp-linux-client_0.1.0_amd64.deb
          dpkg-deb --field dist/linux/irp-linux-client_0.1.0_amd64.deb Package | grep -Fx 'irp-linux-client'
          dpkg-deb --field dist/linux/irp-linux-client_0.1.0_amd64.deb Architecture | grep -Fx 'amd64'
          dpkg-deb --field dist/linux/irp-linux-client_0.1.0_amd64.deb Depends | grep -F 'nodejs'

      - name: Verify checksum
        run: sha256sum -c dist/linux/irp-linux-client_0.1.0_amd64.deb.sha256

      - name: Install Debian package
        run: |
          dpkg -i dist/linux/irp-linux-client_0.1.0_amd64.deb
          dpkg-query -W -f='${Status}\n' irp-linux-client | grep -Fx 'install ok installed'
          test -x /usr/lib/irp/linux-client/dist/index.js
          test -f /usr/lib/systemd/system/irp-linux-client.service
          id irp
          getent group irp

      - name: Verify installed systemd unit contract
        run: |
          systemd-analyze verify /usr/lib/systemd/system/irp-linux-client.service
          grep -Fx 'User=irp' /usr/lib/systemd/system/irp-linux-client.service
          grep -Fx 'Group=irp' /usr/lib/systemd/system/irp-linux-client.service
          grep -Fx 'NoNewPrivileges=true' /usr/lib/systemd/system/irp-linux-client.service
          grep -Fx 'ProtectSystem=strict' /usr/lib/systemd/system/irp-linux-client.service
          grep -Fx 'ProtectHome=true' /usr/lib/systemd/system/irp-linux-client.service

      - name: Run installed Linux client smoke test
        run: |
          /usr/bin/node /usr/lib/irp/linux-client/dist/index.js &
          client_pid=$!
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:17861/ >/tmp/irp-linux-client.html; then
              break
            fi
            if ! kill -0 "$client_pid" 2>/dev/null; then
              echo 'IRP Linux client exited before becoming ready.' >&2
              exit 1
            fi
            sleep 0.25
          done
          test -s /tmp/irp-linux-client.html
          grep -Fq 'IRP Linux Client' /tmp/irp-linux-client.html
          grep -Fq 'Linux Full Client' /tmp/irp-linux-client.html
          kill "$client_pid"

      - name: Upload Debian package evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: irp-linux-debian-primary-device-${{ github.sha }}
          path: |
            dist/linux/irp-linux-client_0.1.0_amd64.deb
            dist/linux/irp-linux-client_0.1.0_amd64.deb.sha256
          if-no-files-found: error
          retention-days: 14
