name: Temporary lockfile refresh

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: write

concurrency:
  group: temporary-lock-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'fix/security-electron-extract-zip'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Skip self-triggered refresh commit
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          MESSAGE="$(git log -1 --pretty=%s)"
          if [[ "${MESSAGE}" == 'chore(ci): refresh Electron lockfile' ]]; then
            echo 'skip=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'skip=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup pnpm
        if: steps.guard.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Refresh lockfile
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Verify high-severity audit
        if: steps.guard.outputs.skip != 'true'
        run: pnpm audit --audit-level high

      - name: Commit lockfile and remove temporary workflow
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/temporary-lock-refresh.yml
          git add pnpm-lock.yaml .github/workflows/temporary-lock-refresh.yml
          if git diff --cached --quiet; then
            echo 'No lockfile changes were generated.'
            exit 0
          fi
          git commit -m 'chore(ci): refresh Electron lockfile'
          git push origin HEAD:fix/security-electron-extract-zip
