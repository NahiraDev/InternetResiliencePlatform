name: Regional Validation

# Intentionally isolated from the standard CI workflow.
# This workflow executes from the configured regional vantage point and
# uses a public HTTPS IP/country endpoint when no operator endpoint is set.

on:
  workflow_dispatch:
    inputs:
      expected_country:
        description: Expected egress country code
        required: false
        default: IR
        type: string
      probe_url:
        description: HTTPS endpoint returning the runner public IP and country
        required: false
        default: https://ipapi.co/json/
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.21.0'
  IRP_REGIONAL_PROBE_URL: https://ipapi.co/json/

jobs:
  regional-validation:
    name: Regional evidence probe
    # Regional evidence still requires the actual regional runner.
    # The `iran` label prevents GitHub-hosted runners from being treated as Iran.
    runs-on: [self-hosted, linux, iran]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run regional probe
        id: probe
        env:
          IRP_REGIONAL_PROBE_URL: ${{ inputs.probe_url || secrets.IRP_REGIONAL_PROBE_URL || env.IRP_REGIONAL_PROBE_URL }}
          IRP_EXPECTED_COUNTRY: ${{ inputs.expected_country }}
        run: |
          set -o pipefail
          node scripts/regional-online-test.mjs | tee regional-validation.json

      - name: Publish regional result to step summary
        if: always()
        run: |
          {
            echo '## Regional Validation Result'
            echo
            echo 'Runner: self-hosted regional vantage (`iran`)'
            echo
            echo '```json'
            if [ -s regional-validation.json ]; then
              cat regional-validation.json
            else
              echo '{"schemaVersion":1,"status":"no-result","error":"Regional probe produced no evidence file."}'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload regional evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: regional-validation-${{ github.run_id }}
          path: regional-validation.json
          if-no-files-found: error
          retention-days: 14
