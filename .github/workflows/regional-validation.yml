name: Regional Validation

# Intentionally isolated from the standard CI workflow.
# This workflow must execute from a controlled regional vantage point.

on:
  workflow_dispatch:
    inputs:
      expected_country:
        description: Expected egress country code
        required: false
        default: IR
        type: string
      probe_url:
        description: HTTPS endpoint that reports the egress IP and country of the regional runner
        required: false
        default: https://ipapi.co/json/
        type: string

permissions:
  contents: read

jobs:
  regional-validation:
    name: Regional evidence probe
    # Never use GitHub-hosted ubuntu-latest for regional evidence.
    # Configure an actual regional machine as a self-hosted runner with the `iran` label.
    runs-on: [self-hosted, linux, iran]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run regional probe
        id: probe
        env:
          IRP_REGIONAL_PROBE_URL: ${{ inputs.probe_url }}
          IRP_EXPECTED_COUNTRY: ${{ inputs.expected_country }}
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile
          pnpm regional:online | tee regional-validation.json

      - name: Publish regional result to step summary
        if: always()
        run: |
          {
            echo '## Regional Validation Result'
            echo
            echo 'Runner: self-hosted regional vantage (`iran`)'
            echo
            echo '```json'
            cat regional-validation.json 2>/dev/null || echo '{"status":"no-result"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload regional evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regional-validation-${{ github.run_id }}
          path: regional-validation.json
          if-no-files-found: error
          retention-days: 14
