name: Bug report
description: Report incorrect or unexpected behavior.
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve the Internet Resilience Platform.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible example.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, shell, commit SHA, and any relevant tooling versions.
