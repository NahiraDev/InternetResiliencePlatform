packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  prisma: 6.19.3
  '@prisma/client': 6.19.3
  vitest: 3.2.7
  '@vitest/coverage-v8': 3.2.7
  vite: 6.4.3
  '@fastify/static': 10.1.1
  effect: 3.20.0
  deepmerge-ts: 8.0.0

# pnpm 11 replaces the legacy onlyBuiltDependencies setting with allowBuilds.
# Keep this allowlist explicit so native lifecycle scripts run only for the
# dependencies that are required by the repository toolchain.
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
