packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  prisma: 6.19.3
  '@prisma/client': 6.19.3
  vitest: 4.1.11
  '@vitest/coverage-v8': 4.1.11
  vite: 6.4.3
  '@fastify/static': 10.1.5
  effect: 3.20.0
  deepmerge-ts: 8.0.0

# pnpm 11 uses allowBuilds for explicit lifecycle-script permissions.
# Keep this allowlist minimal and deterministic for CI.
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: true
