services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: irp
      POSTGRES_PASSWORD: irp_dev_password
      POSTGRES_DB: irp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-only-for-local-compose-32}
      DATABASE_URL: postgresql://irp:irp_dev_password@postgres:5432/irp
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs", "http://127.0.0.1:8080/api/v1/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "8080:8080"
    restart: unless-stopped
volumes:
  postgres-data:
