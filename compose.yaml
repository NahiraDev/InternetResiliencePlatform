services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: irp
      POSTGRES_PASSWORD: irp_dev_password
      POSTGRES_DB: irp
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-only-for-local-compose-32}
      REMOTE_CLIENT_CREDENTIAL_KEY: ${REMOTE_CLIENT_CREDENTIAL_KEY:-change-me-only-for-local-compose-credential-48}
      REMOTE_CLIENT_REFRESH_KEY: ${REMOTE_CLIENT_REFRESH_KEY:-change-me-only-for-local-compose-refresh-48}
      DATABASE_URL: postgresql://irp:irp_dev_password@postgres:5432/irp
      DATABASE_READY_TIMEOUT_MS: 60000
      DATABASE_READY_INTERVAL_MS: 1000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'scripts/healthcheck.mjs', 'http://127.0.0.1:8080/api/v1/ready']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - '8080:8080'
    read_only: true
    tmpfs:
      - /tmp
      - /app/tmp:uid=1001,gid=1001,mode=700
      - /app/.local/share/pnpm:uid=1001,gid=1001,mode=700
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.00
volumes:
  postgres-data:
